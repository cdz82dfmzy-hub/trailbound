(()=>{'use strict';
const W=10,H=8,S=55,KEY='warehouseTycoonV09',spec={receiving:{name:'Réception',color:'#75b8d7',min:4,needed:['inbound']},storage:{name:'Stockage',color:'#e0c47a',min:6,needed:['rack','bulk']},picking:{name:'Préparation',color:'#93c796',min:4,needed:['bench']},shipping:{name:'Expédition',color:'#e7a67c',min:4,needed:['outbound']}},items={inbound:{name:'Poste réception',cost:3000,zone:'receiving',emoji:'📥'},rack:{name:'Rack palettes',cost:2500,zone:'storage',emoji:'📦'},bulk:{name:'Stockage masse',cost:900,zone:'storage',emoji:'🟫'},bench:{name:'Poste préparation',cost:3200,zone:'picking',emoji:'🛠️'},outbound:{name:'Poste expédition',cost:2800,zone:'shipping',emoji:'📤'}},$=id=>document.getElementById(id),cv=$('board'),ctx=cv.getContext('2d');
let game,tool='inspect',scale=1,ox=0,oy=0,history=[],drag=null,pts=new Map(),gesture=null;const REPORTKEY='warehouseTycoonV09Diagnostics';let log=[];try{log=JSON.parse(localStorage.getItem(REPORTKEY))||[];if(!Array.isArray(log))log=[]}catch(e){log=[]}function record(event,details={}){log.push({time:new Date().toISOString(),event,details});if(log.length>1500)log=log.slice(-1500);try{localStorage.setItem(REPORTKEY,JSON.stringify(log))}catch(e){}}
function fresh(){return{money:400000,zones:[],items:[],id:1,completed:false}}try{game=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(game.zones)||!Array.isArray(game.items))game=fresh()}catch(e){game=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch(e){}}function snap(){history.push(JSON.stringify(game));if(history.length>30)history.shift()}function note(s){$('tip').textContent=s;if(/Impossible|insuffisant|minimum|ne peut|Aucun élément/.test(s))record('warning',{message:s,tool})}
function dialog(title,body,buttons){$('modalTitle').textContent=title;$('modalBody').textContent=body;let b=$('modalButtons');b.replaceChildren();buttons.forEach(([label,fn])=>{let el=document.createElement('button');el.textContent=label;el.onclick=()=>{$('modal').classList.add('hidden');if(fn)fn()};b.append(el)});$('modal').classList.remove('hidden')}
function bounds(a,b){return{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x)+1,h:Math.abs(a.y-b.y)+1}}function inside(z,x,y){return x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h}function zone(x,y){return game.zones.find(z=>inside(z,x,y))}function item(x,y){return game.items.find(i=>i.x===x&&i.y===y)}function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function center(){let r=cv.getBoundingClientRect();scale=Math.max(.25,Math.min((r.width-45)/(W*S+110),(r.height-35)/(H*S+150)));ox=(r.width-W*S*scale)/2;oy=(r.height-H*S*scale)/2;draw()}
function resizeCanvas(){let r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));center()}
function tile(p){let x=Math.floor((p.x-ox)/(S*scale)),y=Math.floor((p.y-oy)/(S*scale));return x>=0&&x<W&&y>=0&&y<H?{x,y}:null}

ctx.fillStyle='#657d6f';ctx.fillRect(-70,-70,W*S+140,H*S+160);ctx.fillStyle='#a7b4b1';ctx.fillRect(-50,H*S+13,W*S+100,90);ctx.fillStyle='#d7d9d3';ctx.fillRect(0,0,W*S,H*S);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){let z=zone(x,y);if(z){ctx.fillStyle=spec[z.type].color;ctx.globalAlpha=.77;ctx.fillRect(x*S+1,y*S+1,S-2,S-2);ctx.globalAlpha=1}ctx.strokeStyle='#b5c0b9';ctx.lineWidth=1;ctx.strokeRect(x*S,y*S,S,S)}
game.zones.forEach(z=>{ctx.strokeStyle=spec[z.type].color;ctx.lineWidth=4;ctx.strokeRect(z.x*S+2,z.y*S+2,z.w*S-4,z.h*S-4);ctx.fillStyle='#243b3b';ctx.font='bold 12px system-ui';ctx.fillText(spec[z.type].name,z.x*S+6,z.y*S+17);if(z.w*z.h<spec[z.type].min){ctx.fillStyle='#b52f31';ctx.fillText('Trop petit',z.x*S+6,z.y*S+32)}});
game.items.forEach(i=>{let x=i.x*S,y=i.y*S;ctx.fillStyle='#587077';ctx.fillRect(x+8,y+9,S-16,S-18);ctx.strokeStyle='#2c454c';ctx.lineWidth=2;ctx.strokeRect(x+8,y+9,S-16,S-18);ctx.font='23px system-ui';ctx.textAlign='center';ctx.fillText(items[i.type].emoji,x+S/2,y+S/2+8);ctx.textAlign='left'});
ctx.strokeStyle='#65797b';ctx.lineWidth=8;ctx.strokeRect(-4,-4,W*S+8,H*S+8);ctx.strokeStyle='#eff4f0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W*S,0);ctx.stroke();

ctx.fillStyle='#eef6e9';ctx.font='bold 14px system-ui';ctx.fillText('COUR DE MANŒUVRE',8,H*S+82);ctx.fillText('ACCÈS PIÉTON',8,-19);
if(drag&&drag.start&&drag.end&&(spec[tool]||tool==='resize')){let z=bounds(drag.start,drag.end);ctx.fillStyle='#b7f5d5';ctx.globalAlpha=.36;ctx.fillRect(z.x*S,z.y*S,z.w*S,z.h*S);ctx.globalAlpha=1;ctx.strokeStyle='#277954';ctx.lineWidth=3;ctx.strokeRect(z.x*S,z.y*S,z.w*S,z.h*S)}ctx.restore()}
function refresh(){let ok={};for(let t in spec){ok[t]=game.zones.some(z=>z.type===t&&z.w*z.h>=spec[t].min&&game.items.some(i=>inside(z,i.x,i.y)&&spec[t].needed.includes(i.type)))}let count=Object.values(ok).filter(Boolean).length;$('cash').textContent=game.money.toLocaleString('fr-FR')+' €';$('progress').textContent=count+'/4 cellules opérationnelles · '+(count===4?'Entrepôt prêt pour la suite':Object.keys(ok).filter(t=>!ok[t]).map(t=>spec[t].name).join(' • '));if(count===4&&!game.completed){game.completed=true;record('tutorial_complete',{money:game.money});save();dialog('Entrepôt aménagé ! 🎉','Les quatre cellules possèdent leur équipement indispensable. Cette première livraison V0.9 permet de construire et sauvegarder ton entrepôt. Le personnel, les flux et les contrats arriveront lors des prochaines étapes.',[['Continuer']])}}
function act(a,b){if(!a)return;if(spec[tool]){let z=bounds(a,b||a),s=spec[tool];if(z.w*z.h<s.min){note(s.name+' : minimum '+s.min+' cases ('+s.min*25+' m²).');return}if(game.zones.some(v=>overlap(v,z))){note('Impossible : les cellules se chevauchent.');return}let cost=z.w*z.h*350;if(game.money<cost){note('Budget insuffisant.');return}snap();game.zones.push({...z,type:tool,id:game.id++});game.money-=cost;record('zone_created',{type:tool,rect:z,cost,money:game.money});note(s.name+' créée ('+(z.w*z.h*25)+' m²). Ajoute un équipement adapté.')}
else if(tool==='resize'){let z=zone(a.x,a.y);if(!z){note('Commence ton glissement dans une cellule.');return}let e=b||a,n={x:Math.min(z.x,e.x),y:Math.min(z.y,e.y),w:Math.max(z.x+z.w,e.x+1)-Math.min(z.x,e.x),h:Math.max(z.y+z.h,e.y+1)-Math.min(z.y,e.y)};if(game.zones.some(v=>v!==z&&overlap(v,n))){note('Agrandissement impossible : autre cellule.');return}let cost=(n.w*n.h-z.w*z.h)*350;if(game.money<cost){note('Budget insuffisant.');return}snap();Object.assign(z,n);game.money-=cost;record('zone_resized',{type:z.type,rect:n,cost,money:game.money});note('Cellule agrandie. Pour la réduire, supprime-la puis redessine-la.')}
else if(items[tool]){let z=zone(a.x,a.y),e=items[tool];if(!z||z.type!==e.zone){note('Équipement à placer dans une cellule '+spec[e.zone].name+'.');return}if(item(a.x,a.y)){note('Une case ne peut contenir qu’un équipement.');return}if(game.money<e.cost){note('Budget insuffisant.');return}snap();game.items.push({x:a.x,y:a.y,type:tool});game.money-=e.cost;record('equipment_placed',{type:tool,x:a.x,y:a.y,cost:e.cost,money:game.money});note(e.name+' installé.')}
else if(tool==='erase'){let i=item(a.x,a.y),z=zone(a.x,a.y);if(!i&&!z){note('Aucun élément à supprimer ici.');return}snap();if(i){record('equipment_removed',{type:i.type,x:i.x,y:i.y});game.items=game.items.filter(v=>v!==i);note('Équipement supprimé.')}else{record('zone_removed',{type:z.type,id:z.id});game.items=game.items.filter(v=>!inside(z,v.x,v.y));game.zones=game.zones.filter(v=>v!==z);note('Cellule supprimée.')}}else{let i=item(a.x,a.y),z=zone(a.x,a.y);note(i?items[i.type].name:z?spec[z.type].name+' · '+(z.w*z.h*25)+' m²':'Sol libre · '+(a.x+1)+','+(a.y+1))}
save();refresh();draw()}
function xy(e){let r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);let p=xy(e);pts.set(e.pointerId,p);if(pts.size===2){let v=[...pts.values()];gesture={dist:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),mx:(v[0].x+v[1].x)/2,my:(v[0].y+v[1].y)/2,scale,ox,oy};drag=null;return}drag={start:tile(p),end:null,origin:p,moved:false}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;let p=xy(e);pts.set(e.pointerId,p);if(pts.size===2&&gesture){let v=[...pts.values()],dist=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),mx=(v[0].x+v[1].x)/2,my=(v[0].y+v[1].y)/2;scale=Math.max(.3,Math.min(3,gesture.scale*dist/Math.max(10,gesture.dist)));ox=mx-(gesture.mx-gesture.ox)*scale/gesture.scale;oy=my-(gesture.my-gesture.oy)*scale/gesture.scale;draw();return}if(!drag)return;drag.end=tile(p);drag.moved=drag.moved||Math.hypot(p.x-drag.origin.x,p.y-drag.origin.y)>8;if(tool==='inspect'&&drag.moved){ox+=p.x-drag.origin.x;oy+=p.y-drag.origin.y;drag.origin=p}draw()});

$('menuToggle').onclick=()=>{$('layout').classList.toggle('menu-open');$('menuToggle').textContent=$('layout').classList.contains('menu-open')?'✕ Fermer':'☰ Outils';};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;$('layout').classList.remove('menu-open');$('menuToggle').textContent='☰ Outils';document.querySelectorAll('[data-tool]').forEach(v=>v.classList.toggle('active',v===b));note(spec[tool]?'Glisse pour dessiner '+spec[tool].name+' (min. '+spec[tool].min+' cases).':tool==='resize'?'Glisse depuis une cellule vers l’extérieur pour l’agrandir.':tool==='inspect'?'Glisse pour déplacer la vue, pince avec deux doigts pour zoomer.':tool==='erase'?'Touche un équipement ou une cellule pour supprimer.':'Touche une case pour installer '+items[tool].name+'.')});

$('plus').onclick=()=>{scale=Math.min(3,scale*1.25);draw()};$('minus').onclick=()=>{scale=Math.max(.3,scale/1.25);draw()};$('center').onclick=center;

$('help').onclick=()=>dialog('Bienvenue dans Warehouse Tycoon','Oriente ton iPhone horizontalement. Crée quatre cellules en glissant sur le sol : réception (4 cases), stockage (6), préparation (4), expédition (4). Ajoute ensuite le poste nécessaire dans chaque cellule. Un équipement occupe une case de 5 × 5 m. Explorer permet de déplacer la caméra, deux doigts permettent de zoomer. Les modifications sont sauvegardées automatiquement.',['Jouer'].map(t=>[t]));

function validateState(state){const failures=[],warnings=[],occupied=new Set(),zones=state.zones||[],equipment=state.items||[];if(!Number.isFinite(state.money)||state.money<0)failures.push('Budget invalide');for(const z of zones){if(!spec[z.type]){failures.push('Type de cellule inconnu');continue}if(!Number.isInteger(z.x)||!Number.isInteger(z.y)||!Number.isInteger(z.w)||!Number.isInteger(z.h)||z.x<0||z.y<0||z.w<1||z.h<1||z.x+z.w>W||z.y+z.h>H)failures.push('Cellule hors limites');if(z.w*z.h<spec[z.type].min)warnings.push('Cellule trop petite : '+z.type);for(let y=z.y;y<z.y+z.h;y++)for(let x=z.x;x<z.x+z.w;x++){let k=x+','+y;if(occupied.has(k))failures.push('Chevauchement : '+k);occupied.add(k)}}let placed=new Set();for(const e of equipment){let z=zones.find(v=>inside(v,e.x,e.y));if(!items[e.type]||!z||z.type!==items[e.type].zone)failures.push('Équipement mal placé : '+e.type);let k=e.x+','+e.y;if(placed.has(k))failures.push('Deux équipements sur une case : '+k);placed.add(k)}return{passed:failures.length===0,failures:[...new Set(failures)],warnings:[...new Set(warnings)]}}
function reportObject(extra={}){let result=validateState(game),counts={};for(let e of log)counts[e.event]=(counts[e.event]||0)+1;return{format:'Warehouse Tycoon Diagnostic 1',version:'0.9.2',generatedAt:new Date().toISOString(),device:{viewport:{width:innerWidth,height:innerHeight},orientation:innerWidth>innerHeight?'landscape':'portrait',userAgent:navigator.userAgent},session:{capitalInitial:400000,money:game.money,spent:400000-game.money,zoneCount:game.zones.length,equipmentCount:game.items.length,eventCounts:counts},validation:result,state:JSON.parse(JSON.stringify(game)),events:log.slice(),...extra}}
async function shareReport(report){let filename='warehouse-tycoon-rapport-'+new Date().toISOString().slice(0,10)+'.json',file=new File([JSON.stringify(report,null,2)],filename,{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Rapport Warehouse Tycoon'});record('report_shared');return}}catch(e){if(e.name==='AbortError')return}let url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);record('report_downloaded')}
function simulate(){const cases=[],push=(name,fn)=>{try{let out=fn();cases.push({name,passed:out===true,detail:out===true?'OK':String(out)})}catch(e){cases.push({name,passed:false,detail:e.message})}};let t=fresh();push('État initial et budget',()=>validateState(t).passed&&t.money===400000);let layouts=[{type:'receiving',x:0,y:4,w:2,h:2,e:'inbound'},{type:'storage',x:2,y:0,w:4,h:3,e:'rack'},{type:'picking',x:6,y:0,w:2,h:2,e:'bench'},{type:'shipping',x:8,y:4,w:2,h:2,e:'outbound'}];for(const z of layouts){push('Créer cellule '+z.type,()=>{let r={x:z.x,y:z.y,w:z.w,h:z.h,type:z.type,id:t.id++},cost=r.w*r.h*350;if(r.w*r.h<spec[z.type].min||t.zones.some(v=>overlap(v,r)))return 'Surface ou chevauchement';t.zones.push(r);t.money-=cost;return validateState(t).passed});push('Équiper cellule '+z.type,()=>{let e=items[z.e];t.items.push({type:z.e,x:z.x,y:z.y});t.money-=e.cost;return validateState(t).passed})}push('Quatre cellules fonctionnelles',()=>Object.keys(spec).every(type=>t.zones.some(z=>z.type===type&&t.items.some(e=>inside(z,e.x,e.y)&&spec[type].needed.includes(e.type)))));push('Refuser chevauchement',()=>t.zones.some(z=>overlap(z,{x:0,y:4,w:2,h:2})));push('Refuser équipement hors zone',()=>{let clone=JSON.parse(JSON.stringify(t));clone.items.push({type:'rack',x:9,y:7});return !validateState(clone).passed});push('Refuser double équipement',()=>{let clone=JSON.parse(JSON.stringify(t));clone.items.push({...clone.items[0]});return !validateState(clone).passed});push('Budget cohérent',()=>t.money===400000-layouts.reduce((sum,z)=>sum+z.w*z.h*350+items[z.e].cost,0));let output={passed:cases.filter(c=>c.passed).length,total:cases.length,cases,simulatedState:t};record('automatic_test',{passed:output.passed,total:output.total});return output}
$('report').onclick=()=>{let r=reportObject();record('report_opened',{events:r.events.length});dialog('📋 Rapport de partie','Événements enregistrés : '+r.events.length+'. Budget : '+game.money.toLocaleString('fr-FR')+' €. Cellules : '+game.zones.length+'. Équipements : '+game.items.length+'. Validation : '+(r.validation.passed?'OK':'erreurs détectées')+'. Le fichier JSON contient tes actions et ton aménagement. Envoie-le dans notre conversation pour analyse.',[['Fermer'],['Partager / exporter',()=>shareReport(reportObject())]])};
$('autoTest').onclick=()=>{let t=simulate();dialog('🧪 Mode test automatique',t.passed+'/'+t.total+' contrôles réussis. '+t.cases.filter(c=>!c.passed).map(c=>c.name+': '+c.detail).join(' ; ')+(t.passed===t.total?' Aucun échec détecté sur les scénarios couverts.':'')+' Ce test s’exécute sur une partie fictive et ne modifie pas ta sauvegarde.',[['Fermer'],['Exporter résultats',()=>shareReport(reportObject({automaticTest:t}))]])};
window.addEventListener('resize',resizeCanvas);new ResizeObserver(resizeCanvas).observe($('stage'));resizeCanvas();refresh();if(!game.zones.length)setTimeout(()=>$('help').click(),400);
})();
</script></body></html>
