function refresh(){routeCheck=null;if(flow){flow=null;record('logistics_cycle_cancelled',{reason:'Layout changed'});$('flowStart').textContent='🚚 Lancer un camion'}if(workersOn)makeAgents();let ok={};for(let t in spec){ok[t]=game.zones.some(z=>z.type===t&&z.w*z.h>=spec[t].min&&game.items.some(i=>inside(z,i.x,i.y)&&spec[t].needed.includes(i.type)))}let count=Object.values(ok).filter(Boolean).length;$('cash').textContent=game.money.toLocaleString('fr-FR')+' €';$('progress').textContent=count+'/4 cellules opérationnelles · '+(count===4?'Entrepôt prêt pour la suite':Object.keys(ok).filter(t=>!ok[t]).map(t=>spec[t].name).join(' • '));if(count===4&&!game.completed){game.completed=true;record('tutorial_complete',{money:game.money});save();dialog('Entrepôt aménagé ! 🎉','Les quatre cellules possèdent leur équipement indispensable. Cette première livraison V0.9 permet de construire et sauvegarder ton entrepôt. Le personnel, les flux et les contrats arriveront lors des prochaines étapes.',[['Continuer']])}}
function act(a,b){if(!a)return;if(spec[tool]){let z=bounds(a,b||a),s=spec[tool];if(z.w*z.h<s.min){note(s.name+' : minimum '+s.min+' cases ('+s.min*25+' m²).');return}if(game.zones.some(v=>overlap(v,z))){note('Impossible : les cellules se chevauchent.');return}let cost=z.w*z.h*350;if(game.money<cost){note('Budget insuffisant.');return}snap();game.zones.push({...z,type:tool,id:game.id++});game.money-=cost;record('zone_created',{type:tool,rect:z,cost,money:game.money});note(s.name+' créée ('+(z.w*z.h*25)+' m²). Ajoute un équipement adapté.')}

function neighbors(x,y){return[[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b])=>a>=0&&a<W&&b>=0&&b<H)}
function accessMap(){let blocked=new Set(game.items.map(i=>i.x+','+i.y));let dist=new Map(),parent=new Map(),q=[];for(let x of [2,5,8]){let k=x+','+(H-1);if(!blocked.has(k)&&!dist.has(k)){dist.set(k,0);q.push([x,H-1])}}for(let i=0;i<q.length;i++){let [x,y]=q[i];for(let [nx,ny]of neighbors(x,y)){let k=nx+','+ny;if(!blocked.has(k)&&!dist.has(k)){dist.set(k,dist.get(x+','+y)+1);parent.set(k,x+','+y);q.push([nx,ny])}}}return{dist,parent,reachable:new Set(dist.keys()),blocked}}
function analyzeRoutes(){let m=accessMap(),issues=[],good=[];for(const i of game.items){let reachable=neighbors(i.x,i.y).some(([x,y])=>m.reachable.has(x+','+y));(reachable?good:issues).push({item:i,reason:reachable?'accessible':'Aucune case adjacente reliée aux quais'})}let zones=[];for(const z of game.zones){let open=false;for(let y=z.y;y<z.y+z.h;y++)for(let x=z.x;x<z.x+z.w;x++)if(m.reachable.has(x+','+y))open=true;zones.push({type:z.type,id:z.id,accessible:open})}return{...m,blocked:issues,accessibleEquipment:good.length,totalEquipment:game.items.length,zones,accessibleZones:zones.filter(z=>z.accessible).length}}
function pathTo(m,x,y){let k=x+','+y,rev=[];if(!m.reachable.has(k))return[];while(k){let [a,b]=k.split(',').map(Number);rev.push([a,b]);k=m.parent.get(k)}return rev.reverse()}
function targetsFor(role,m){let types=role===0?['rack','bulk']:role===1?['bench']:['inbound','outbound'];return game.items.filter(i=>types.includes(i.type)).flatMap(i=>neighbors(i.x,i.y).filter(([x,y])=>m.reachable.has(x+','+y)).map(([x,y])=>({x,y})))}
function pathBetween(m,start,dest){let blocked=m.blocked,queue=[[start.x,start.y]],seen=new Set([start.x+','+start.y]),parent=new Map(),goal=dest.x+','+dest.y;for(let n=0;n<queue.length;n++){let [x,y]=queue[n],key=x+','+y;if(key===goal){let rev=[];while(key){let [a,b]=key.split(',').map(Number);rev.push({x:a,y:b});key=parent.get(key)}return rev.reverse()}for(let [nx,ny]of neighbors(x,y)){let k=nx+','+ny;if(!blocked.has(k)&&!seen.has(k)){seen.add(k);parent.set(k,key);queue.push([nx,ny])}}}return[]}
function assignDestination(a,m){let choices=targetsFor(a.role,m);if(!choices.length){a.path=[];a.index=0;return}let start={x:Math.round(a.x),y:Math.round(a.y)},valid=choices.filter(v=>v.x!==start.x||v.y!==start.y);let target=(valid.length?valid:choices)[Math.floor(Math.random()*(valid.length||choices.length))];let path=pathBetween(m,start,target);a.path=path;a.index=path.length>1?1:path.length;a.wait=path.length<=1?.6:0}
function makeAgents(){let m=accessMap();agents=[];const roles=[{label:'C',color:'#f1b44c'},{label:'P',color:'#61bce2'},{label:'R',color:'#e99575'}];roles.forEach((role,idx)=>{let options=targetsFor(idx,m);if(!options.length)return;let p=options[Math.min(idx,options.length-1)];let a={x:p.x,y:p.y,path:[],index:0,wait:0,label:role.label,color:role.color,role:idx};agents.push(a);assignDestination(a,m)})}
function frame(t){let dt=lastFrame?Math.min(.05,Math.max(0,(t-lastFrame)/1000)):0;lastFrame=t;if(workersOn&&agents.length){let m=accessMap();for(const a of agents){if(a.wait>0){a.wait=Math.max(0,a.wait-dt);continue}let remaining=dt*1.7;while(remaining>0){if(a.index>=a.path.length){assignDestination(a,m);break}let target=a.path[a.index],dx=target.x-a.x,dy=target.y-a.y,distance=Math.hypot(dx,dy);if(distance<.0001){a.x=target.x;a.y=target.y;a.index++;continue}let step=Math.min(remaining,distance);a.x+=dx/distance*step;a.y+=dy/distance*step;remaining-=step;if(step>=distance-.0001){a.x=target.x;a.y=target.y;a.index++}else break}}}advanceFlow(dt*gameSpeed);draw();requestAnimationFrame(frame)}

const FLOW_STAGES=[
{key:'unload',name:'Déchargement quai réception',role:'R',type:'inbound',seconds:2.5,carry:true},
{key:'check',name:'Contrôle au poste réception',role:'R',type:'inbound',seconds:3,carry:false},
{key:'putaway',name:'Cariste : mise en stock',role:'C',type:'rack',seconds:2.5,carry:true},
{key:'pick',name:'Préparateur : préparation commande',role:'P',type:'bench',seconds:3,carry:true},
{key:'ship',name:'Cariste : transfert expédition',role:'C',type:'outbound',seconds:2.5,carry:true},
{key:'load',name:'Expédition : chargement camion',role:'E',type:'outbound',seconds:2.5,carry:true}
];
const DOCKS=[2,5,8];
function dockFor(type){let m=accessMap(),choices=[];for(let dock of DOCKS){let p={x:dock,y:H-1};if(!m.reachable.has(p.x+','+p.y))continue;let candidates=game.items.filter(i=>i.type===type).flatMap(i=>neighbors(i.x,i.y).filter(([x,y])=>m.reachable.has(x+','+y)).map(([x,y])=>({x,y})));let nearest=Infinity;for(let c of candidates){let path=pathBetween(m,p,c);if(path.length)nearest=Math.min(nearest,path.length)}if(Number.isFinite(nearest))choices.push({dock,dist:nearest})}choices.sort((a,b)=>a.dist-b.dist);return choices[0]?.dock}
function flowDestination(type,origin){let m=accessMap(),candidates=game.items.filter(i=>i.type===type||(type==='rack'&&i.type==='bulk')).flatMap(i=>neighbors(i.x,i.y).filter(([x,y])=>m.reachable.has(x+','+y)).map(([x,y])=>({x,y,device:i})));let ranked=candidates.map(c=>({...c,path:pathBetween(m,origin,c)})).filter(c=>c.path.length).sort((a,b)=>a.path.length-b.path.length);return ranked[0]||null}
function stopFlow(message,reason){if(flow){flowStats.blocked++;record('logistics_blocked',{cycle:flow.id,stage:FLOW_STAGES[flow.stage]?.key,reason})}flow=null;$('flowStart').textContent='🚚 Lancer un camion';note(message)}


const PRODUCT_TYPES=[{key:'standard',name:'Palette standard',emoji:'📦',storage:'rack'},{key:'oversize',name:'Hors gabarit',emoji:'🪵',storage:'bulk'},{key:'heavy',name:'Charge lourde',emoji:'🧱',storage:'bulk'}];
let palletSerial=0;
function newPallet(f,i){let type=PRODUCT_TYPES[(f.id+i)%PRODUCT_TYPES.length];return{id:'PAL-'+(++palletSerial),kind:type.key,emoji:type.emoji,storage:type.storage,state:'truck',x:f.inDock,y:8,worker:null,slot:null,history:['truck']}}
function allPallets(f){return [...f.pallets,...f.staging,...f.stored,...f.picking,...f.shipping]}
function station(type){let m=accessMap();return game.items.filter(i=>i.type===type).flatMap(i=>neighbors(i.x,i.y).filter(([x,y])=>m.reachable.has(x+','+y)).map(([x,y])=>({x,y,device:i})))}
function availableStation(type,from,used){let m=accessMap();return station(type).filter(v=>!used.has(v.device.x+','+v.device.y)).map(v=>({...v,path:pathBetween(m,from,{x:v.x,y:v.y})})).filter(v=>v.path.length).sort((a,b)=>a.path.length-b.path.length)[0]}
function reservedDevices(f,states){let used=new Set();for(const p of allPallets(f)){if(p.slot&&states.includes(p.state))used.add(p.slot.device.x+','+p.slot.device.y);if(states.includes(p.state)&&!p.slot&&p.state!=='carried')used.add(p.x+','+p.y)}return used}
function accessiblePickup(a,p){let m=accessMap(),from={x:Math.round(a.x),y:Math.round(a.y)};let options=neighbors(Math.round(p.x),Math.round(p.y)).filter(([x,y])=>m.reachable.has(x+','+y)).map(([x,y])=>({x,y,path:pathBetween(m,from,{x,y})})).filter(v=>v.path.length).sort((u,v)=>u.path.length-v.path.length);return options[0]||null}
function task(a,p,phase,dest){let m=accessMap();let path=pathBetween(m,{x:Math.round(a.x),y:Math.round(a.y)},dest);if(!path.length)return false;a.job={p,phase,dest,timer:0};a.path=path;a.pathIndex=1;p.worker=a.role;return true}
function logOnce(f,key,message){if(f.lastWarning===key)return;f.lastWarning=key;note(message);record('logistics_wait',{reason:key,truck:f.id})}
function receiveTask(a){let f=flow;if(!f)return;let p=f.pallets.find(p=>p.state==='truck'&&!p.worker);if(!p)return;
let used=reservedDevices(f,['reserved','received','carried']);let slot=availableStation('inbound',{x:f.inDock,y:7},used);
if(!slot){logOnce(f,'receiving_full','⛔ Réception saturée : le cariste doit libérer des postes.');return}
p.slot=slot;p.state='reserved';if(!task(a,p,'unload',{x:f.inDock,y:7})){p.state='truck';p.slot=null;p.worker=null;return}
f.lastWarning='';record('pallet_assigned',{id:p.id,kind:p.kind,worker:a.role});}
function putawayTask(a){let f=flow;if(!f)return;let p=f.staging.find(p=>p.state==='received'&&!p.worker);if(!p)return;
let used=reservedDevices(f,['putaway','stored','carried']);let slot=availableStation(p.storage,{x:Math.round(a.x),y:Math.round(a.y)},used);
if(!slot){logOnce(f,'storage_full_'+p.storage,'⛔ Stockage '+(p.storage==='rack'?'racks':'masse')+' saturé ou inaccessible.');return}
p.slot=slot;p.state='putaway';let pickup=accessiblePickup(a,p);if(!pickup||!task(a,p,'collect_receiving',{x:pickup.x,y:pickup.y})){p.state='received';p.worker=null;p.slot=null;return}
f.lastWarning='';record('putaway_assigned',{id:p.id,kind:p.kind,storage:p.storage,worker:a.role})}
function supplyTask(a){let f=flow;if(!f)return;let p=f.stored.find(p=>p.state==='stored'&&!p.worker&&p.ordered);if(!p)return;
let used=reservedDevices(f,['supplying','ready','preparing','prepared','carried']);let slot=availableStation('bench',{x:Math.round(a.x),y:Math.round(a.y)},used);
if(!slot){logOnce(f,'picking_full','⛔ Postes de préparation occupés.');return}
p.slot=slot;p.state='supplying';let pickup=accessiblePickup(a,p);if(!pickup||!task(a,p,'collect_storage',{x:pickup.x,y:pickup.y})){p.state='stored';p.worker=null;p.slot=null;return}
f.lastWarning='';record('supply_assigned',{id:p.id,worker:a.role})}
function prepareTask(a){let f=flow;if(!f)return;let p=f.picking.find(p=>p.state==='ready'&&!p.worker);if(!p)return;
let pickup=accessiblePickup(a,p);if(!pickup||!task(a,p,'prepare',{x:pickup.x,y:pickup.y}))return;p.state='preparing';record('preparation_started',{id:p.id,worker:a.role})}
function transferTask(a){let f=flow;if(!f)return;let p=f.picking.find(p=>p.state==='prepared'&&!p.worker);if(!p)return;
let used=reservedDevices(f,['shipping','shipped_ready','loading','carried']);let slot=availableStation('outbound',{x:Math.round(a.x),y:Math.round(a.y)},used);
if(!slot){logOnce(f,'shipping_full','⛔ Zone expédition saturée.');return}
p.slot=slot;p.state='shipping';let pickup=accessiblePickup(a,p);if(!pickup||!task(a,p,'collect_prepared',{x:pickup.x,y:pickup.y})){p.state='prepared';p.worker=null;p.slot=null;return}
f.lastWarning='';record('shipping_transfer_assigned',{id:p.id,worker:a.role})}
function shipTask(a){let f=flow;if(!f)return;let p=f.shipping.find(p=>p.state==='shipped_ready'&&!p.worker);if(!p)return;
let pickup=accessiblePickup(a,p);if(!pickup||!task(a,p,'collect_shipping',{x:pickup.x,y:pickup.y}))return;p.state='loading';record('loading_started',{id:p.id,worker:a.role})}
function movePallet(f,p,from,to,state){let index=from.indexOf(p);if(index>=0)from.splice(index,1);to.push(p);p.state=state;p.worker=null;p.history.push(state)}
function advanceAgent(a,dt){let f=flow,j=a.job;if(!j)return;let remaining=dt*1.5;
while(remaining>0&&a.pathIndex<a.path.length){let t=a.path[a.pathIndex],dx=t.x-a.x,dy=t.y-a.y,d=Math.hypot(dx,dy);if(d<.0001){a.pathIndex++;continue}let step=Math.min(d,remaining);a.x+=dx/d*step;a.y+=dy/d*step;remaining-=step;if(step>=d-.0001){a.x=t.x;a.y=t.y;a.pathIndex++}}
if(a.pathIndex<a.path.length)return;
j.timer+=dt;let p=j.p;if(j.timer<1.1)return;
const next=(phase,dest)=>{j.phase=phase;j.timer=0;j.dest=dest;a.path=pathBetween(accessMap(),{x:Math.round(a.x),y:Math.round(a.y)},dest);a.pathIndex=1;if(!a.path.length){a.job=null;p.worker=null;record('path_blocked',{pallet:p.id,phase})}};
const finish=()=>{a.job=null;p.worker=null;f.lastWarning=''};
if(j.phase==='unload'){p.state='carried';p.history.push('unloaded');next('deliver_receiving',{x:p.slot.x,y:p.slot.y})}
else if(j.phase==='deliver_receiving'){p.x=p.slot.device.x;p.y=p.slot.device.y;movePallet(f,p,f.pallets,f.staging,'received');p.slot=null;f.delivered++;record('pallet_received',{id:p.id,kind:p.kind,delivered:f.delivered});finish()}
else if(j.phase==='collect_receiving'){p.state='carried';next('deliver_storage',{x:p.slot.x,y:p.slot.y})}
else if(j.phase==='deliver_storage'){p.x=p.slot.device.x;p.y=p.slot.device.y;movePallet(f,p,f.staging,f.stored,'stored');p.slot=null;record('pallet_stored',{id:p.id,kind:p.kind,storage:p.storage});finish()}
else if(j.phase==='collect_storage'){p.state='carried';next('deliver_picking',{x:p.slot.x,y:p.slot.y})}
else if(j.phase==='deliver_picking'){p.x=p.slot.device.x;p.y=p.slot.device.y;movePallet(f,p,f.stored,f.picking,'ready');p.slot=null;record('picking_supplied',{id:p.id});finish()}
else if(j.phase==='prepare'){p.state='prepared';p.history.push('prepared');record('pallet_prepared',{id:p.id});finish()}
else if(j.phase==='collect_prepared'){p.state='carried';next('deliver_shipping',{x:p.slot.x,y:p.slot.y})}
else if(j.phase==='deliver_shipping'){p.x=p.slot.device.x;p.y=p.slot.device.y;movePallet(f,p,f.picking,f.shipping,'shipped_ready');p.slot=null;record('pallet_at_shipping',{id:p.id});finish()}
else if(j.phase==='collect_shipping'){p.state='carried';next('load_truck',{x:f.outDock,y:7})}
else if(j.phase==='load_truck'){movePallet(f,p,f.shipping,f.shipped,'shipped');p.x=f.outDock;p.y=8;f.shippedCount++;f.ordersCompleted++;record('order_fulfilled',{id:p.id,order:p.orderId});record('pallet_shipped',{id:p.id,kind:p.kind,shipped:f.shippedCount});note('🚚 Expédition : '+f.shippedCount+' palettes chargées.');finish()}
}
function receivingNextTruck(){let f=flow;flowStats.completed++;record('inbound_truck_unloaded',{truck:f.id,pallets:f.palletTotal});f.id=++flowStats.started;f.delivered=0;f.lastWarning='';f.pallets=Array.from({length:f.palletTotal},(_,i)=>newPallet(f,i));f.turnaround=0;record('logistics_cycle_start',{cycle:f.id,automatic:true,pallets:f.palletTotal});note('🚛 Nouveau camion de réception : '+f.id)}
function advanceFlow(dt){if(!flow||flowPaused||!dt)return;let f=flow;f.elapsed+=dt;f.orderTimer+=dt;if(f.orderTimer>=22){f.orderTimer=0;let available=f.stored.filter(p=>p.state==='stored'&&!p.ordered);if(available.length){let p=available[0];p.ordered=true;p.orderId='CMD-'+(++f.orderSerial);record('customer_order_created',{order:p.orderId,pallet:p.id,kind:p.kind});note('🧾 Nouvelle commande '+p.orderId+' : '+p.kind)}else{record('customer_order_waiting',{reason:'no_available_stock'})}}let stockLabel=$('stockSummary');if(stockLabel)stockLabel.textContent='📦 Stock : '+f.stored.filter(p=>p.state==='stored').length+' · Commandes : '+f.ordersCompleted+' expédiées · '+f.stored.filter(p=>p.ordered).length+' à préparer';
for(const a of Object.values(f.staff)){if(a.clockingIn){if(a.arrivalDelay>0){a.arrivalDelay-=dt;continue}let target=a.arrivalPath[0];if(target){let dx=target.x-a.x,dy=target.y-a.y,d=Math.hypot(dx,dy),step=Math.min(d,dt*1.25);if(d>.001){a.x+=dx/d*step;a.y+=dy/d*step}if(d<=step+.001){a.x=target.x;a.y=target.y;a.arrivalPath.shift()}}if(!a.arrivalPath.length){a.clockingIn=false;record('employee_clocked_in',{role:a.role,truck:f.id})}continue}if(a.job)advanceAgent(a,dt)}
for(const a of Object.values(f.staff)){if(a.job||a.clockingIn)continue;if(a.role==='R1'||a.role==='R2')receiveTask(a);else if(a.role==='C')putawayTask(a);else if(a.role==='A')supplyTask(a);else if(a.role==='P')prepareTask(a);else if(a.role==='T')transferTask(a);else if(a.role==='E')shipTask(a)}
for(const p of allPallets(f))if(p.state==='carried'&&p.worker){let a=f.staff[p.worker];if(a){p.x=a.x;p.y=a.y}}
if(f.delivered>=f.palletTotal){f.turnaround+=dt;if(f.turnaround>2)receivingNextTruck()}}
$('flowStart').onclick=()=>{if(flow){note('Chaîne logistique déjà active.');return}let m=analyzeRoutes();if(m.accessibleZones<4){note('⛔ Quatre cellules accessibles nécessaires.');return}
let inDock=dockFor('inbound'),outDock=dockFor('outbound');if(inDock===undefined||outDock===undefined){note('⛔ Quai réception ou expédition inaccessible.');return}
flowStats.started++;flow={id:flowStats.started,elapsed:0,inDock,outDock,palletTotal:4,delivered:0,shippedCount:0,ordersCompleted:0,orderSerial:0,orderTimer:12,turnaround:0,lastWarning:'',pallets:[],staging:[],stored:[],picking:[],shipping:[],shipped:[],staff:{}};
flow.pallets=Array.from({length:4},(_,i)=>newPallet(flow,i));
const people=[['R1',inDock,7,'#e99575'],['R2',inDock+1,7,'#dc7965'],['C',5,7,'#f1b44c'],['A',5,7,'#71bd88'],['P',5,7,'#61bce2'],['T',outDock,7,'#d6a45d'],['E',outDock,7,'#b98aee']];
for(const [index,[role,x,y,color]] of people.entries()){let m=accessMap(),entry={x:inDock,y:7},start={x:0.15+(index%4)*.75,y:H+.2+Math.floor(index/4)*.4};flow.staff[role]={x:start.x,y:start.y,role,label:role,color,job:null,path:[],pathIndex:0,clockingIn:true,arrivalDelay:index*.55,arrivalPath:[{x:inDock,y:H+.15},entry]}}
flowPaused=false;$('flowPause').textContent='⏸ Pause';workersOn=false;agents=[];$('workers').textContent='👷 Déplacements : OFF';$('flowStart').textContent='🚛 Flux logistique actif';record('logistics_cycle_start',{cycle:flow.id,pallets:4,employees:people.map(p=>p[0]),mode:'stock_and_orders',staffSpawn:'clocking_area'});note('🚛 Flux complet lancé : réception → stockage → picking → expédition.');draw()};
$('flowPause').onclick=()=>{flowPaused=!flowPaused;$('flowPause').textContent=flowPaused?'▶ Reprendre':'⏸ Pause';note(flowPaused?'Simulation en pause.':'Simulation reprise.')};
function validateState(state){const failures=[],warnings=[],occupied=new Set(),zones=state.zones||[],equipment=state.items||[];if(!Number.isFinite(state.money)||state.money<0)failures.push('Budget invalide');for(const z of zones){if(!spec[z.type]){failures.push('Type de cellule inconnu');continue}if(!Number.isInteger(z.x)||!Number.isInteger(z.y)||!Number.isInteger(z.w)||!Number.isInteger(z.h)||z.x<0||z.y<0||z.w<1||z.h<1||z.x+z.w>W||z.y+z.h>H)failures.push('Cellule hors limites');if(z.w*z.h<spec[z.type].min)warnings.push('Cellule trop petite : '+z.type);for(let y=z.y;y<z.y+z.h;y++)for(let x=z.x;x<z.x+z.w;x++){let k=x+','+y;if(occupied.has(k))failures.push('Chevauchement : '+k);occupied.add(k)}}let placed=new Set();for(const e of equipment){let z=zones.find(v=>inside(v,e.x,e.y));if(!items[e.type]||!z||z.type!==items[e.type].zone)failures.push('Équipement mal placé : '+e.type);let k=e.x+','+e.y;if(placed.has(k))failures.push('Deux équipements sur une case : '+k);placed.add(k)}return{passed:failures.length===0,failures:[...new Set(failures)],warnings:[...new Set(warnings)]}}
function reportObject(extra={}){let result=validateState(game),counts={};for(let e of log)counts[e.event]=(counts[e.event]||0)+1;return{format:'Warehouse Tycoon Diagnostic 1',version:'0.11.0',generatedAt:new Date().toISOString(),device:{viewport:{width:innerWidth,height:innerHeight},orientation:innerWidth>innerHeight?'landscape':'portrait',userAgent:navigator.userAgent},logistics:{...flowStats,active:flow?{id:flow.id,mode:'full_chain',elapsed:flow.elapsed,palletDone:flow.delivered,palletTotal:flow.palletTotal,shipped:flow.shippedCount,ordersCompleted:flow.ordersCompleted,ordersPending:flow.stored.filter(p=>p.ordered).length,speed:gameSpeed,inventory:{receiving:flow.staging.length,storage:flow.stored.length,picking:flow.picking.length,shipping:flow.shipping.length},pallets:allPallets(flow).map(p=>({id:p.id,kind:p.kind,state:p.state,x:p.x,y:p.y,worker:p.worker,history:p.history}))}:null},session:{capitalInitial:400000,money:game.money,spent:400000-game.money,zoneCount:game.zones.length,equipmentCount:game.items.length,eventCounts:counts},validation:result,circulation:(()=>{let r=analyzeRoutes();return{accessibleEquipment:r.accessibleEquipment,totalEquipment:r.totalEquipment,inaccessible:r.blocked.map(v=>({type:v.item.type,x:v.item.x,y:v.item.y,reason:v.reason})),zones:r.zones}})(),state:JSON.parse(JSON.stringify(game)),events:log.slice(),...extra}}
async function shareReport(report){const counterKey='warehouseTycoonReportCounter';let number=(parseInt(localStorage.getItem(counterKey)||'0',10)||0)+1;let filename='Rapport '+number+'.json';report.reportNumber=number;let file=new File([JSON.stringify(report,null,2)],filename,{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Rapport '+number+' — Warehouse Tycoon'});localStorage.setItem(counterKey,String(number));record('report_shared',{number});return}}catch(e){if(e.name==='AbortError')return}let url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);localStorage.setItem(counterKey,String(number));record('report_downloaded',{number})}
function simulate(){const cases=[],push=(name,fn)=>{try{let out=fn();cases.push({name,passed:out===true,detail:out===true?'OK':String(out)})}catch(e){cases.push({name,passed:false,detail:e.message})}};let t=fresh();push('État initial et budget',()=>validateState(t).passed&&t.money===400000);let layouts=[{type:'receiving',x:0,y:4,w:2,h:2,e:'inbound'},{type:'storage',x:2,y:0,w:4,h:3,e:'rack'},{type:'picking',x:6,y:0,w:2,h:2,e:'bench'},{type:'shipping',x:8,y:4,w:2,h:2,e:'outbound'}];for(const z of layouts){push('Créer cellule '+z.type,()=>{let r={x:z.x,y:z.y,w:z.w,h:z.h,type:z.type,id:t.id++},cost=r.w*r.h*350;if(r.w*r.h<spec[z.type].min||t.zones.some(v=>overlap(v,r)))return 'Surface ou chevauchement';t.zones.push(r);t.money-=cost;return validateState(t).passed});push('Équiper cellule '+z.type,()=>{let e=items[z.e];t.items.push({type:z.e,x:z.x,y:z.y});t.money-=e.cost;return validateState(t).passed})}push('Quatre cellules fonctionnelles',()=>Object.keys(spec).every(type=>t.zones.some(z=>z.type===type&&t.items.some(e=>inside(z,e.x,e.y)&&spec[type].needed.includes(e.type)))));push('Refuser chevauchement',()=>t.zones.some(z=>overlap(z,{x:0,y:4,w:2,h:2})));push('Refuser équipement hors zone',()=>{let clone=JSON.parse(JSON.stringify(t));clone.items.push({type:'rack',x:9,y:7});return !validateState(clone).passed});push('Refuser double équipement',()=>{let clone=JSON.parse(JSON.stringify(t));clone.items.push({...clone.items[0]});return !validateState(clone).passed});push('Budget cohérent',()=>t.money===400000-layouts.reduce((sum,z)=>sum+z.w*z.h*350+items[z.e].cost,0));let output={passed:cases.filter(c=>c.passed).length,total:cases.length,cases,simulatedState:t};record('automatic_test',{passed:output.passed,total:output.total});return output}
$('report').onclick=()=>{let r=reportObject();record('report_opened',{events:r.events.length});dialog('📋 Rapport de partie','Événements enregistrés : '+r.events.length+'. Budget : '+game.money.toLocaleString('fr-FR')+' €. Cellules : '+game.zones.length+'. Équipements : '+game.items.length+'. Validation : '+(r.validation.passed?'OK':'erreurs détectées')+'. Le fichier JSON contient tes actions et ton aménagement. Envoie-le dans notre conversation pour analyse.',[['Fermer'],['Partager / exporter',()=>shareReport(reportObject())]])};
$('autoTest').onclick=()=>{let t=simulate();dialog('🧪 Mode test automatique',t.passed+'/'+t.total+' contrôles réussis. '+t.cases.filter(c=>!c.passed).map(c=>c.name+': '+c.detail).join(' ; ')+(t.passed===t.total?' Aucun échec détecté sur les scénarios couverts.':'')+' Ce test s’exécute sur une partie fictive et ne modifie pas ta sauvegarde.',[['Fermer'],['Exporter résultats',()=>shareReport(reportObject({automaticTest:t}))]])};
