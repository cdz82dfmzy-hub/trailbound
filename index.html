<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111318"><title>Problem — Chess training</title><style>
*{box-sizing:border-box}body{margin:0;background:#111318;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{max-width:560px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:28px;font-weight:800;letter-spacing:-1px}.brand span{color:#b7c96f}.pill{background:#20242b;border:1px solid #303640;border-radius:999px;padding:7px 11px;font-size:13px}.card{background:#191c22;border:1px solid #2b3039;border-radius:18px;padding:14px}.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.turn{font-weight:700}.rating{font-size:13px;color:#aeb5c0}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border-radius:10px;overflow:hidden;touch-action:manipulation;box-shadow:0 8px 30px #0008}.sq img{display:block;max-width:100%;max-height:100%}.sq{min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,10vw,54px);font-family:"Times New Roman","Arial Unicode MS",serif;font-variant-emoji:text;line-height:1;position:relative;user-select:none;-webkit-user-select:none}.light{background:#e8e2cf}.dark{background:#78926a}.sq.sel:after{content:"";position:absolute;inset:7%;border:4px solid #f4cf57;border-radius:8px}.sq.target:before{content:"";position:absolute;width:25%;height:25%;border-radius:50%;background:#1118}.status{text-align:center;min-height:52px;padding:16px 6px 6px;font-weight:700}.status.ok{color:#a8d67c}.status.bad{color:#ff7d7d}.actions{display:flex;gap:10px;margin-top:10px}button{appearance:none;border:0;border-radius:13px;padding:13px 16px;font-size:16px;font-weight:750;background:#b7c96f;color:#10120d;flex:1}button.secondary{background:#292e36;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#191c22;border:1px solid #2b3039;border-radius:14px;padding:11px;text-align:center}.stat b{display:block;font-size:20px}.stat small{color:#9da5b0}.foot{text-align:center;color:#747d89;font-size:12px;margin-top:16px}</style></head><body><main class="app"><div class="top"><div class="brand">Pr<span>o</span>blem</div><div class="pill">♟ Entraînement illimité</div></div><section class="card"><div class="meta"><div class="turn" id="turn">À vous de jouer</div><div class="rating" id="rating"></div></div><div id="board" class="board"></div><div id="status" class="status">Trouvez le meilleur coup.</div><div class="actions"><button class="secondary" id="retry">↻ Recommencer</button><button id="next">Problème suivant →</button></div></section><div class="stats"><div class="stat"><b id="solved">0</b><small>Réussis</small></div><div class="stat"><b id="errors">0</b><small>Erreurs</small></div><div class="stat"><b id="streak">0</b><small>Série</small></div></div><div class="foot">Prototype V0.1 · positions tactiques ouvertes Lichess</div></main><script>
const P={"P":"wP","N":"wN","B":"wB","R":"wR","Q":"wQ","K":"wK","p":"bP","n":"bN","b":"bB","r":"bR","q":"bQ","k":"bK"};
const puzzles=[
{id:"00sHx",fen:"q3k1nr/1pp1nQpp/3p4/1P2p3/4P3/B1PP1b2/B5PP/5K2 b k - 0 17",moves:"e8d7 a2e6 d7d8 f7f8",rating:1760},
{id:"00sJ9",fen:"r3r1k1/p4ppp/2p2n2/1p6/3P1qb1/2NQR3/PPB2PP1/R1B3K1 w - - 5 18",moves:"e3g3 e8e1 g1h2 e1c1 a1c1 f4h6 h2g1 h6c1",rating:2671},
{id:"00sJb",fen:"Q1b2r1k/p2np2p/5bp1/q7/5P2/4B3/PPP3PP/2KR1B1R w - - 1 17",moves:"d1d7 a5e1 d7d1 e1e3 c1b1 e3b6",rating:2235},
{id:"00sO1",fen:"1k1r4/pp3pp1/2p1p3/4b3/P3n1P1/8/KPP2PN1/3rBR1R b - - 2 31",moves:"b8c7 e1a5 b7b6 f1d1",rating:998}
];
let pi=0,state=null,solution=[],step=1,selected=null,startState=null,failed=false,done=false,viewSide="w",playerSide="w";
let stats=JSON.parse(localStorage.getItem("problemStats")||'{"solved":0,"errors":0,"streak":0}');
function parseFen(f){let [pos,side]=f.split(" ");let b={};let rows=pos.split("/");for(let r=0;r<8;r++){let file=0;for(let c of rows[r]){if(/\d/.test(c))file+=+c;else{b[String.fromCharCode(97+file)+(8-r)]=c;file++}}}return {b,side}}
function apply(s,m){let a=m.slice(0,2),z=m.slice(2,4),pc=s.b[a];if(!pc)return;s.b[z]=m[4]?(pc===pc.toUpperCase()?m[4].toUpperCase():m[4]):pc;delete s.b[a];s.side=s.side==="w"?"b":"w"}
function clone(s){return {b:{...s.b},side:s.side}}
function load(){let p=puzzles[pi%puzzles.length];state=parseFen(p.fen);solution=p.moves.split(" ");apply(state,solution[0]);step=1;startState=clone(state);playerSide=state.side;viewSide=playerSide;selected=null;failed=false;done=false;document.getElementById("rating").textContent="Difficulté "+p.rating;document.getElementById("turn").textContent=state.side==="w"?"♙ Aux blancs de jouer":"♟ Aux noirs de jouer";setStatus("Trouvez le meilleur coup.","");render()}
function render(){let el=document.getElementById("board");el.innerHTML="";let white=playerSide==="w";let ranks=white?[8,7,6,5,4,3,2,1]:[1,2,3,4,5,6,7,8],files=white?["a","b","c","d","e","f","g","h"]:["h","g","f","e","d","c","b","a"];ranks.forEach((rank,ri)=>files.forEach((file,fi)=>{let sq=file+rank,d=document.createElement("div");d.className="sq "+((ri+fi)%2?"dark":"light")+(selected===sq?" sel":"");d.dataset.sq=sq;if(state.b[sq]){let im=document.createElement("img");im.src="https://lichess1.org/assets/piece/cburnett/"+(state.b[sq]===state.b[sq].toUpperCase()?"w":"b")+state.b[sq].toUpperCase()+".svg";im.alt="";im.draggable=false;im.style.cssText="width:86%;height:86%;object-fit:contain;pointer-events:none";d.appendChild(im)}d.onclick=()=>tap(sq);el.appendChild(d)}));updateStats()}
function tap(sq){if(done)return;let pc=state.b[sq];if(!selected){if(pc&&((state.side==="w"&&pc===pc.toUpperCase())||(state.side==="b"&&pc===pc.toLowerCase()))){selected=sq;render()}return}if(sq===selected){selected=null;render();return}let move=selected+sq,expected=solution[step];if(expected&&move===expected.slice(0,4)){apply(state,expected);selected=null;step++;render();setStatus("✓ Bon coup !","ok");if(step>=solution.length){finish();return}setTimeout(()=>{apply(state,solution[step]);step++;render();if(step>=solution.length)finish();else setStatus("À vous. Continuez la combinaison.","")},450)}else{failed=true;stats.errors++;stats.streak=0;save();selected=null;setStatus("✕ Ce n’est pas le meilleur coup. Réessayez.","bad");render()}}
function finish(){done=true;if(!failed){stats.solved++;stats.streak++}else stats.solved++;save();setStatus("✓ Problème résolu !","ok");render()}
function setStatus(t,c){let e=document.getElementById("status");e.textContent=t;e.className="status "+c}
function save(){localStorage.setItem("problemStats",JSON.stringify(stats))}
function updateStats(){solved.textContent=stats.solved;errors.textContent=stats.errors;streak.textContent=stats.streak}
document.getElementById("retry").onclick=()=>{state=clone(startState);step=1;selected=null;done=false;setStatus("Trouvez le meilleur coup.","");render()};
document.getElementById("next").onclick=()=>{pi=(pi+1)%puzzles.length;load()};
load();
</script></body></html>
