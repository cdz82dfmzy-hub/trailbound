<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17252c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Warehouse Tycoon"><title>Warehouse Tycoon V0.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c24;color:#f0f4ed;font:14px system-ui,-apple-system,sans-serif}main{max-width:950px;margin:auto;padding:12px}h1{font-size:22px;margin:4px 0}.top,.hud,.speedbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.panel{background:#1c2c35;border:1px solid #40535c;border-radius:13px;padding:11px;margin:9px 0}.hud{justify-content:flex-start;gap:10px 16px}.hud b{color:#d5ed9d}.muted,small{color:#a9bdc4}button,select{background:#2b424e;border:1px solid #4d6770;border-radius:9px;color:#f7faf8;padding:10px 9px;font-weight:700;font-size:13px}button.active{background:#c7e28e;color:#17271b;border-color:#e4f6bd}button:active{transform:scale(.98)}#game{width:100%;aspect-ratio:840/570;background:linear-gradient(#466873,#243e49);border:1px solid #536c70;border-radius:13px;overflow:hidden;touch-action:none}#game canvas{display:block;width:100%;height:100%;touch-action:none}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tools button{min-height:52px}.notice{color:#d9e9a9;min-height:20px;margin-top:9px}.foot{text-align:center;color:#91a6ae;font-size:12px;margin:12px}.tag{font-size:11px;background:#a8c979;color:#14251a;border-radius:6px;padding:3px 6px;vertical-align:middle}#loading{padding:40px;text-align:center}@media(min-width:700px){.tools{grid-template-columns:repeat(6,1fr)}} </style></head><body><main><div class="top"><h1>🏗️ Warehouse <span style="color:#c8e49b">Tycoon</span> <span class="tag">V0.2</span></h1><button id="newGame">Nouvelle partie</button></div><div class="panel hud"><span>Mode : <b id="mode">Carrière</b></span><span>Budget : <b id="money">250 000 €</b></span><span>Jour <b id="day">1</b></span><span>🕒 <b id="hour">08:00</b></span><span>Capacité <b id="capacity">0</b> pal.</span></div><div class="panel speedbar"><span>⏱️ Simulation</span><div><button data-speed="0">⏸</button> <button data-speed="1" class="active">▶ ×1</button> <button data-speed="2">×2</button> <button data-speed="4">×4</button></div></div><div id="game"><div id="loading">Chargement du moteur graphique…</div></div><div class="panel"><div class="tools" id="tools"><button data-tool="inspect" class="active">👆 Inspecter</button><button data-tool="floor">🏭 Cellule<br><small>12 000 €</small></button><button data-tool="rack">📦 Rack<br><small>2 500 €</small></button><button data-tool="bulk">🟫 Masse<br><small>900 €</small></button><button data-tool="dock">🚛 Quai<br><small>5 000 €</small></button><button data-tool="erase">🧹 Démolir</button></div><div class="notice" id="notice">Construis une cellule, puis aménage tes zones de stockage.</div></div><div class="foot">Phaser 3 • V0.2 • Sauvegarde locale automatique • Compatible iPhone</div></main><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
(()=>{"use strict";const W=12,H=12,TW=52,TH=27,OX=420,OY=95,prices={floor:12000,rack:2500,bulk:900,dock:5000},names={inspect:"Inspecter",floor:"Cellule",rack:"Rack palettes",bulk:"Stockage de masse",dock:"Quai",erase:"Démolir"},store="warehouseTycoonV01";let tool="inspect",speed=1,elapsed=0,scene,graphics,hover=-1,workers=[],game;const $=id=>document.getElementById(id);function fresh(mode){return{mode,money:250000,day:1,minutes:480,cells:Array(W*H).fill("empty")}}try{game=JSON.parse(localStorage.getItem(store))||fresh("career");if(!Array.isArray(game.cells)||game.cells.length!==W*H)game=fresh("career")}catch(e){game=fresh("career")}function save(){try{localStorage.setItem(store,JSON.stringify(game))}catch(e){}}function msg(t){$("notice").textContent=t}function hud(){$("mode").textContent=game.mode==="sandbox"?"Bac à sable":"Carrière";$("money").textContent=game.mode==="sandbox"?"∞":game.money.toLocaleString("fr-FR")+" €";$("day").textContent=game.day;$("hour").textContent=String(Math.floor(game.minutes/60)).padStart(2,"0")+":"+String(game.minutes%60).padStart(2,"0");$("capacity").textContent=game.cells.filter(x=>x==="rack").length*12+game.cells.filter(x=>x==="bulk").length*8}function p(x,y,z=0){return{x:OX+(x-y)*TW/2,y:OY+(x+y)*TH/2-z}}function fillpoly(pts,col,alpha=1,line=0){graphics.fillStyle(col,alpha);graphics.fillPoints(pts,true);if(line){graphics.lineStyle(1,line,.8);graphics.strokePoints(pts,true)}}function diamond(x,y,color,edge=0x4d6d64){fillpoly([p(x,y),p(x+1,y),p(x+1,y+1),p(x,y+1)],color,1,edge)}function cube(x,y,h,top,left,right,scale=.9){let off=(1-scale)/2,a=p(x+off,y+off),b=p(x+1-off,y+off),c=p(x+1-off,y+1-off),d=p(x+off,y+1-off),au=p(x+off,y+off,h),bu=p(x+1-off,y+off,h),cu=p(x+1-off,y+1-off,h),du=p(x+off,y+1-off,h);fillpoly([d,c,cu,du],left,1,0x405050);fillpoly([b,c,cu,bu],right,1,0x405050);fillpoly([au,bu,cu,du],top,1,0x667b7a)}function line(a,b,col,width=1){graphics.lineStyle(width,col,1);graphics.lineBetween(a.x,a.y,b.x,b.y)}function drawTile(x,y,t){const idx=y*W+x;diamond(x,y,(x+y)%2?0x5d7c68:0x668771,0x779780);if(t==="floor"){diamond(x,y,0xbac8bd,0x9aaea8);let a=p(x,y),b=p(x+1,y),d=p(x,y+1);line(a,b,0xe0e9df,2);line(a,d,0xe0e9df,2);cube(x+.02,y+.02,5,0xb8c9c2,0x8fa49d,0xa4b6ae,.95)}if(t==="rack"){diamond(x,y,0xa9b8ae);cube(x+.12,y+.1,25,0xf0c86f,0xa87a46,0xc18f51,.82);cube(x+.19,y+.15,30,0x5b8094,0x35556b,0x436c80,.55);let a=p(x+.25,y+.15,30),b=p(x+.25,y+.85,30);line(a,b,0xf7d888,2)}if(t==="bulk"){diamond(x,y,0xb9ae8e);cube(x+.18,y+.18,13,0xc28c50,0x855c37,0xa87343,.72);cube(x+.26,y+.25,20,0xd5a064,0x94613b,0xb17c4a,.52)}if(t==="dock"){diamond(x,y,0x7b96a1);cube(x+.06,y+.06,8,0x93aab1,0x566e79,0x69828c,.9);let a=p(x+.22,y+.22,9),b=p(x+.78,y+.22,9);line(a,b,0xf6d56c,4)}if(idx===hover){fillpoly([p(x,y),p(x+1,y),p(x+1,y+1),p(x,y+1)],0xf4e69b,.26,0xffe88a)}}function draw(){if(!graphics)return;graphics.clear();fillpoly([p(-.5,-.5),p(W+.5,-.5),p(W+.5,H+.5),p(-.5,H+.5)],0x354f47,1,0x6f8d7e);for(let sum=0;sum<W+H-1;sum++)for(let x=0;x<W;x++){let y=sum-x;if(y>=0&&y<H)drawTile(x,y,game.cells[y*W+x])}hud()}function cellAt(px,py){let dx=(px-OX)/(TW/2),dy=(py-OY)/(TH/2),x=Math.floor((dy+dx)/2),y=Math.floor((dy-dx)/2);return x>=0&&x<W&&y>=0&&y<H?y*W+x:-1}function act(i){if(i<0)return;let old=game.cells[i],x=i%W,y=Math.floor(i/W);if(tool==="inspect"){msg("Case "+(x+1)+"/"+(y+1)+" : "+({empty:"terrain libre",floor:"cellule",rack:"rack palettes",bulk:"stockage de masse",dock:"quai"}[old]||old));return}if(tool==="erase"){if(old==="empty"){msg("Cette case est déjà libre.");return}game.cells[i]="empty";msg("Équipement démoli, sans remboursement.")}else{if(old!=="empty"){msg("Case occupée : démolis d’abord l’équipement.");return}if(tool!=="floor"&&!game.cells.includes("floor")){msg("Construis d’abord une cellule.");return}let cost=prices[tool];if(game.mode!=="sandbox"&&game.money<cost){msg("Budget insuffisant.");return}if(game.mode!=="sandbox")game.money-=cost;game.cells[i]=tool;msg(names[tool]+" construit"+(game.mode==="sandbox"?"":" : −"+cost.toLocaleString("fr-FR")+" €")+".")}save();draw()}function animate(time){if(!scene)return;workers.forEach((w,i)=>{let floor=[];game.cells.forEach((v,k)=>{if(v==="floor")floor.push(k)});w.setVisible(floor.length>0);if(!floor.length)return;let a=floor[i%floor.length],b=floor[(i+1)%floor.length],q=(Math.sin(time*.0005*(i+1))+1)/2,pa=p(a%W+.5,Math.floor(a/W)+.5,8),pb=p(b%W+.5,Math.floor(b/W)+.5,8);w.setPosition(pa.x+(pb.x-pa.x)*q,pa.y+(pb.y-pa.y)*q)})}function start(){if(typeof Phaser==="undefined"){ $("loading").textContent="Le moteur Phaser n’a pas pu charger. Vérifie ta connexion et recharge le jeu.";return}new Phaser.Game({type:Phaser.AUTO,parent:"game",width:840,height:570,backgroundColor:"#29424b",scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},render:{antialias:true},scene:{create(){scene=this;$("loading").remove();graphics=this.add.graphics();draw();let person=this.add.graphics();person.fillStyle(0xf5ca8b);person.fillCircle(0,-9,4);person.fillStyle(0xe0ad42);person.fillRoundedRect(-5,-5,10,12,2);person.fillStyle(0x253e4b);person.fillRect(-4,7,3,5);person.fillRect(2,7,3,5);let person2=this.add.graphics();person2.fillStyle(0xf2d1a0);person2.fillCircle(0,-9,4);person2.fillStyle(0x6ea4cc);person2.fillRoundedRect(-5,-5,10,12,2);person2.fillStyle(0x253e4b);person2.fillRect(-4,7,3,5);person2.fillRect(2,7,3,5);workers=[person,person2];this.input.on("pointerdown",pointer=>{act(cellAt(pointer.worldX,pointer.worldY))});this.input.on("pointermove",pointer=>{let next=cellAt(pointer.worldX,pointer.worldY);if(next!==hover){hover=next;draw()}})},update(time,delta){if(speed){elapsed+=delta*speed;if(elapsed>=4000){let steps=Math.floor(elapsed/4000);elapsed%=4000;game.minutes+=steps*10;if(game.minutes>=1440){game.day+=Math.floor(game.minutes/1440);game.minutes%=1440}save();hud()}}animate(time)}}})}document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(e=>e.classList.toggle("active",e===b));msg("Outil : "+names[tool]+". Touche une case du terrain.")});document.querySelectorAll("[data-speed]").forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll("[data-speed]").forEach(e=>e.classList.toggle("active",e===b));msg(speed?"Simulation ×"+speed:"Simulation en pause")});$("newGame").onclick=()=>{if(!confirm("Remplacer la sauvegarde par une nouvelle partie ?"))return;let sandbox=confirm("OK = Bac à sable (budget illimité)\nAnnuler = Carrière (250 000 €)");game=fresh(sandbox?"sandbox":"career");save();draw();msg("Nouvelle partie : "+(sandbox?"bac à sable":"carrière"))};hud();start()})();
</script></body></html>
