<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121a20"><title>Warehouse Tycoon</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f0f5f7;font-family:system-ui,-apple-system,sans-serif}.app{max-width:950px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:23px;margin:6px 0}small,.muted{color:#aebcc5}.panel{background:#1b2831;border:1px solid #344550;border-radius:14px;padding:12px;margin:10px 0}.hud{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.hud b{color:#d8e89d}.mapwrap{overflow:hidden;background:linear-gradient(#253b45,#172a33);border-radius:14px;border:1px solid #435763;position:relative;touch-action:none}.mapwrap svg{display:block;width:100%;height:auto;touch-action:none}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{border:1px solid #465761;background:#293c48;color:white;padding:11px 7px;border-radius:10px;font-weight:650;font-size:13px;cursor:pointer}button.active{background:#b5d37e;color:#142116;border-color:#d6ef9f}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.controls button{min-width:49px}.notice{font-size:13px;min-height:25px;color:#dbe7a4;margin-top:8px}.foot{font-size:12px;color:#91a4ae;text-align:center;margin:12px}.key{color:#b9d881}#map polygon{cursor:pointer}#map polygon:hover{stroke:#fff;stroke-width:1.5}@media(min-width:700px){.tools{grid-template-columns:repeat(6,1fr)}} </style></head><body><main class="app"><div class="top"><h1>🏗️ Warehouse <span class="key">Tycoon</span></h1><button id="newGame">Nouvelle partie</button></div><div class="panel"><div class="hud"><span>Mode : <b id="mode">Carrière</b></span><span>Budget : <b id="money">250 000 €</b></span><span>Jour : <b id="day">1</b></span><span>Heure : <b id="hour">08:00</b></span><span>Capacité : <b id="capacity">0</b> palettes</span></div></div><div class="panel"><div class="controls"><span class="muted">Temps</span><button data-speed="0">⏸</button><button data-speed="1" class="active">▶ ×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button><span class="muted" id="selected">Outil : Inspecter</span></div></div><div class="mapwrap"><svg id="map" viewBox="0 0 840 610" xmlns="http://www.w3.org/2000" role="img" aria-label="Terrain de construction isométrique"></svg></div><div class="panel"><div class="tools" id="tools"><button data-tool="inspect" class="active">👆 Inspecter</button><button data-tool="floor">🏭 Cellule<br><small>12 000 €</small></button><button data-tool="rack">📦 Rack<br><small>2 500 €</small></button><button data-tool="bulk">🟫 Masse<br><small>900 €</small></button><button data-tool="dock">🚛 Quai<br><small>5 000 €</small></button><button data-tool="erase">🧹 Démolir</button></div><div class="notice" id="notice">Choisis un outil, puis touche une case du terrain.</div></div><div class="foot">Prototype V0.1 • Construction isométrique • Sauvegarde locale automatique</div></main><script>
const W=12,H=12,TW=48,TH=25,OX=420,OY=55,prices={floor:12000,rack:2500,bulk:900,dock:5000},names={inspect:"Inspecter",floor:"Cellule",rack:"Rack",bulk:"Stockage de masse",dock:"Quai",erase:"Démolir"};let tool="inspect",speed=1,elapsed=0,game;
function initial(mode){return {mode,money:250000,day:1,minutes:480,cells:Array(W*H).fill("empty")}}
try{game=JSON.parse(localStorage.getItem("warehouseTycoonV01"))||initial("career");if(!Array.isArray(game.cells)||game.cells.length!==W*H)game=initial("career")}catch(e){game=initial("career")}
const svg=document.getElementById("map"),NS="http://www.w3.org/2000";
function el(tag,attrs,parent=svg){let n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));parent.appendChild(n);return n}
function pt(x,y){return [OX+(x-y)*TW/2,OY+(x+y)*TH/2]}
function poly(points,fill,stroke="#4d6972",parent=svg){return el("polygon",{points:points.map(p=>p.join(",")).join(" "),fill,stroke,"stroke-width":1},parent)}
function block(x,y,height,color){let a=pt(x,y),b=pt(x+1,y),c=pt(x+1,y+1),d=pt(x,y+1);let up=p=>[p[0],p[1]-height];poly([d,c,up(c),up(d)],color[1]);poly([b,c,up(c),up(b)],color[2]);poly([up(a),up(b),up(c),up(d)],color[0])}
function label(x,y,s,color="#fff"){let p=pt(x+.5,y+.5);let n=el("text",{x:p[0],y:p[1]-6,"text-anchor":"middle","font-size":17,fill:color,"font-weight":700,"pointer-events":"none"});n.textContent=s}
function draw(){svg.innerHTML="";poly([pt(0,0),pt(W,0),pt(W,H),pt(0,H)],"#314f47","#668779");for(let sum=0;sum<W+H-1;sum++)for(let x=0;x<W;x++){let y=sum-x;if(y<0||y>=H)continue;let idx=y*W+x,type=game.cells[idx],a=pt(x,y),b=pt(x+1,y),c=pt(x+1,y+1),d=pt(x,y+1);let fills={empty:"#4d715f",floor:"#aeb9ae",rack:"#91a5a6",bulk:"#b3a47d",dock:"#657c89"};let tile=poly([a,b,c,d],fills[type]);tile.dataset.index=idx;tile.addEventListener("click",()=>act(idx));if(type==="floor"){block(x+.08,y+.08,7,["#c7d0c9","#8b9d99","#a2b3b0"])}if(type==="rack"){block(x+.16,y+.13,23,["#f0c76c","#af7f45","#c49554"]);label(x,y,"▤","#382c21")}if(type==="bulk"){block(x+.2,y+.2,11,["#b9824e","#805432","#98623b"]);label(x,y,"▣","#fff2d0")}if(type==="dock"){block(x+.12,y+.12,5,["#768d9b","#536b7b","#617d89"]);label(x,y,"⇧","#f9e7a4")}}updateHud()}
function save(){try{localStorage.setItem("warehouseTycoonV01",JSON.stringify(game))}catch(e){}}
function message(t){document.getElementById("notice").textContent=t}
function act(i){let old=game.cells[i],x=i%W,y=Math.floor(i/W);if(tool==="inspect"){message("Case "+(x+1)+"/"+(y+1)+" : "+({empty:"terrain libre",floor:"cellule",rack:"rack palettes",bulk:"stockage de masse",dock:"quai"}[old]));return}if(tool==="erase"){if(old==="empty"){message("Cette case est déjà libre.");return}game.cells[i]="empty";message("Équipement retiré (aucun remboursement).")}else{if(old!=="empty"){message("Case occupée. Démolis d’abord l’équipement.");return}if(tool!=="floor"&&!game.cells.includes("floor")){message("Construis d’abord une cellule pour commencer l’aménagement.");return}let cost=prices[tool];if(game.mode==="career"&&game.money<cost){message("Budget insuffisant.");return}if(game.mode==="career")game.money-=cost;game.cells[i]=tool;message(names[tool]+" construit"+(game.mode==="career"?" : −"+cost.toLocaleString("fr-FR")+" €":"")+".")}save();draw()}
function updateHud(){document.getElementById("mode").textContent=game.mode==="career"?"Carrière":"Bac à sable";document.getElementById("money").textContent=game.mode==="sandbox"?"∞":game.money.toLocaleString("fr-FR")+" €";document.getElementById("day").textContent=game.day;document.getElementById("hour").textContent=String(Math.floor(game.minutes/60)).padStart(2,"0")+":"+String(game.minutes%60).padStart(2,"0");document.getElementById("capacity").textContent=game.cells.filter(x=>x==="rack").length*12+game.cells.filter(x=>x==="bulk").length*8}
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(e=>e.classList.toggle("active",e===b));document.getElementById("selected").textContent="Outil : "+names[tool];message("Touche une case pour "+(tool==="inspect"?"l’inspecter":tool==="erase"?"la libérer":"construire : "+names[tool]))});
document.querySelectorAll("[data-speed]").forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll("[data-speed]").forEach(e=>e.classList.toggle("active",e===b))});
document.getElementById("newGame").onclick=()=>{if(!confirm("Commencer une nouvelle partie ? La sauvegarde actuelle sera remplacée."))return;let sandbox=confirm("Mode bac à sable (OK) ou carrière (Annuler) ?");game=initial(sandbox?"sandbox":"career");save();draw();message("Nouvelle partie : "+(sandbox?"bac à sable":"carrière"))};
setInterval(()=>{if(!speed)return;elapsed+=speed;if(elapsed>=4){game.minutes+=Math.floor(elapsed/4)*10;elapsed%=4;if(game.minutes>=1440){game.day+=Math.floor(game.minutes/1440);game.minutes%=1440}save();updateHud()}},1000);draw();
</script></body></html>
