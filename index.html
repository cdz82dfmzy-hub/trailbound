<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trailbound V0.11 Manager Lab</title><style>
:root{--b:#0e1512;--c:#17211c;--p:#202d26;--l:#35483d;--t:#eff8f2;--m:#aabbb0;--a:#72d991}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui,-apple-system,sans-serif}.w{max-width:900px;margin:auto;padding:14px}.head,.grid{display:grid;gap:9px}.head{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px}.panel{background:var(--p);padding:10px;border-radius:11px;margin-top:8px}.muted{color:var(--m);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}button{background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:10px;padding:10px;font-weight:700;cursor:pointer}button.pri{background:#245235}button.red{background:#4d2929}button:disabled{opacity:.4}.bar{height:10px;background:var(--p);border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--a)}textarea{width:100%;height:420px;background:#0b100d;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:10px}.mt{margin-top:10px}
@media(max-width:650px){.head{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.tabs{font-size:10px}}
</style></head><body><div class=w><div id=head class=head></div><div class=tabs>
<button onclick=trainView()>🏋️<br>Training</button><button onclick=runnerView()>🏃<br>Traileur</button><button onclick=racesView()>⛰️<br>Courses</button><button onclick=lootView()>🎒<br>Loot</button><button onclick=reportView()>🧪<br>Rapport</button></div><main id=main></main></div>
<script>
const ds=[["Zone 2","end",100,10],["Fractionné","speed",125,12],["Côtes","climb",130,13],["Descente","tech",120,12],["Renforcement","strength",115,11],["Récupération","recovery",95,9]];
const cs=[
{name:"Sentier des Pins",km:8,up:280,w:{speed:.50,end:.20,tech:.15,strength:.05,climb:.05,recovery:.05},fav:"shoes"},
{name:"Pic des Brumes",km:21,up:1350,w:{climb:.40,end:.30,strength:.10,recovery:.10,tech:.05,speed:.05},fav:"poles"},
{name:"Forteresse des Alpes",km:32,up:2200,w:{tech:.35,strength:.25,end:.20,climb:.10,recovery:.07,speed:.03},fav:"shoes"}];
const sn={shoes:"👟 Chaussures",poles:"🦯 Bâtons",jacket:"🧥 Veste",pack:"🎒 Sac"};
let S=JSON.parse(localStorage.getItem("tb11")||"null")||{credits:3000,boost:5,stats:{end:50,speed:50,climb:50,tech:50,strength:50,recovery:50},lvl:{end:1,speed:1,climb:1,tech:1,strength:1,recovery:1},training:null,equip:{shoes:null,poles:null,jacket:null,pack:null},inv:[],cl:[1,1,1],id:1,races:[],logs:[],td:0,spent:0,bu:0,recycled:0,rc:0,ae:0,batches:0};
let tt=null,rt=null;const main=document.getElementById("main");
function save(){localStorage.setItem("tb11",JSON.stringify(S));head()}
function head(){document.getElementById("head").innerHTML=[["Mont","I"],["Crédits",S.credits],["Accél.",S.boost],["Puissance",power()],["Courses",S.races.length]].map(x=>'<div class=card><span class=muted>'+x[0]+'</span><br><b>'+x[1]+'</b></div>').join("")}
function gain(l){return Math.max(2,Math.round(1.2+1.25*Math.pow(l,.72)))}function cost(d,l){return Math.round(d[2]*Math.pow(1.58,l-1)/10)*10}function dur(d,l){return Math.round(d[3]*Math.pow(1.38,l-1))}
function power(){return Object.values(S.stats).reduce((a,b)=>a+b,0)+Object.values(S.equip).filter(Boolean).reduce((a,x)=>a+x.power,0)}
function log(t,o={}){S.logs.push({type:t,...o});if(S.logs.length>100)S.logs.shift();save()}
function trainView(){clearInterval(rt);let a=S.training;main.innerHTML=(a?'<div class=card><b>⏳ '+a.name+' Nv.'+a.lv+' → '+(a.lv+1)+'</b><div class=row><span>+'+a.g+' '+a.stat+'</span><b id=clock>'+a.left+'s</b></div><div class="bar mt"><div id=tb class=fill style="width:'+(100*(1-a.left/a.total))+'%"></div></div><button class="pri mt" onclick=boost()>⚡ Accélérer</button></div>':"")+'<div class="grid mt">'+ds.map((d,i)=>{let l=S.lvl[d[1]],c=cost(d,l);return '<div class=card><div class=row><b>'+d[0]+'</b><b>Nv.'+l+'</b></div><div class=panel>Stat '+S.stats[d[1]]+'<br>Prochain gain <b>+'+gain(l)+'</b><br>💰 '+c+' • ⏱️ '+dur(d,l)+'s</div><button class="pri mt" '+(a||S.credits<c?"disabled":"")+' onclick=startTrain('+i+')>Entraîner</button></div>'}).join("")+'</div>'}
function startTrain(i){let d=ds[i],l=S.lvl[d[1]],c=cost(d,l);if(S.training||S.credits<c)return;S.credits-=c;S.spent+=c;S.training={name:d[0],stat:d[1],lv:l,g:gain(l),left:dur(d,l),total:dur(d,l)};log("training_start",{name:d[0],level:l,cost:c,gain:gain(l)});trainView();tickTrain()}
function tickTrain(){clearInterval(tt);if(!S.training)return;tt=setInterval(()=>{S.training.left--;save();let c=document.getElementById("clock"),b=document.getElementById("tb");if(c)c.textContent=S.training.left+"s";if(b)b.style.width=100*(1-S.training.left/S.training.total)+"%";if(S.training.left<=0)finishTrain(false)},1000)}
function finishTrain(b){if(!S.training)return;clearInterval(tt);let a=S.training;S.stats[a.stat]+=a.g;S.lvl[a.stat]++;S.td++;S.training=null;log("training_finish",{name:a.name,newLevel:S.lvl[a.stat],gain:a.g,boosted:b});trainView()}function boost(){if(S.boost<1||!S.training)return;S.boost--;S.bu++;finishTrain(true)}
function runnerView(){clearInterval(rt);main.innerHTML='<div class=grid><div class=card><h3>🏃 Profil</h3>'+Object.entries(S.stats).map(([k,v])=>'<div class="panel row"><span>'+k+' • Nv.'+S.lvl[k]+'</span><b>'+v+'</b></div>').join("")+'</div><div class=card><div class=row><h3>Build</h3><button class=pri onclick=autoEquip()>⚡ Auto-équip</button></div>'+Object.entries(sn).map(([k,n])=>'<div class=panel><b>'+n+'</b><div class=muted>'+(S.equip[k]?S.equip[k].name+" • +"+S.equip[k].power:"Vide")+'</div></div>').join("")+'</div></div>'}
function autoEquip(silent=false){let n=0;Object.keys(sn).forEach(k=>{let x=S.inv.filter(a=>a.slot===k).sort((a,b)=>b.power-a.power)[0];if(x&&(!S.equip[k]||x.power>S.equip[k].power)){S.equip[k]=x;n++;S.ae++}});if(n)log("auto_equip",{count:n});else save();if(!silent)runnerView()}
function racesView(){clearInterval(rt);main.innerHTML='<div class=grid>'+cs.map((c,i)=>'<div class=card><div class=row><b>'+c.name+'</b><b>Niv.'+S.cl[i]+'</b></div><div class=muted>'+c.km+' km • D+ '+c.up+' m</div><button class="pri mt" onclick=prep('+i+')>Préparer</button></div>').join("")+'</div>'}
function prep(i){let c=cs[i];main.innerHTML='<div class=card><h2>'+c.name+' — Niv.'+S.cl[i]+'</h2><p class=muted>Les séries ×10 consomment 20% de crédits supplémentaires par course. Elles utilisent le même moteur et enregistrent les 10 résultats.</p><div class=panel><label><input type=radio name=s value=safe> 🛡️ Prudente</label><br><label><input type=radio name=s value=balanced checked> ⚖️ Régulière</label><br><label><input type=radio name=s value=attack> 🔥 Offensive</label></div><button class="pri mt" onclick="visualRace('+i+',document.querySelector(\'input[name=s]:checked\').value)">🏁 Course normale</button> <button class="mt" onclick="batch10('+i+',document.querySelector(\'input[name=s]:checked\').value)">⏩ Simuler ×10</button></div>'}
function ability(c){let a=0;for(let k in c.w)a+=S.stats[k]*c.w[k];return a+Object.values(S.equip).filter(Boolean).reduce((z,x)=>z+x.power,0)*.55}
function simulate(i,strat){let c=cs[i],lv=S.cl[i],ab=ability(c),en=100,legs=100,rank=30,pts=[],drain=strat==="attack"?1.28:strat==="safe"?.78:1,sp=strat==="attack"?2:strat==="safe"?-1:0;for(let p=2;p<=100;p+=2){en-=1.35*drain*(1+lv*.035)*Math.max(.62,1-(S.stats.end-50)/220);legs-=1.02*drain*(1+lv*.035)*Math.max(.65,1-(S.stats.strength-50)/230);let opp=50+lv*3.2,edge=(ab+sp-opp)/5.5,target=Math.max(1,Math.min(50,Math.round(26-edge*2.3))),noise=(Math.random()-.5)*3;rank=Math.round(Math.max(1,Math.min(50,rank+(target-rank)*.18+noise)));if(strat==="attack"&&(en<25||legs<25))rank=Math.min(50,rank+2);pts.push(rank);if(en<=0||legs<=0)return finish(i,strat,rank,true,en,legs,ab,pts)}return finish(i,strat,rank,false,en,legs,ab,pts)}
function visualRace(i,strat){showResult(simulate(i,strat))}
function dc(r){return r===1?5:r<=3?4:r<=14?3:r<=24?2:1}
function makeItem(rank,i){let slot=Math.random()<.45?cs[i].fav:Object.keys(sn)[Math.floor(Math.random()*4)],bonus=rank<=10?(11-rank)*.005:0,x=Math.random(),ri=x<.006+bonus?4:x<.06+bonus*1.6?3:x<.30?2:x<.72?1:0;if(rank===1&&ri<3)ri=3;let rs=["Commun","Inhabituel","Rare","Épique","Légendaire"],q=Math.floor(Math.random()*101),gr=ri>=3?(q>=90?"⭐⭐⭐⭐":q>=75?"⭐⭐⭐":q>=60?"⭐⭐":"⭐"):"";if(ri===4&&Math.random()<.001){q=100;gr="👑"}let pw=Math.max(1,Math.round((ri+1)*2+q/24));return{id:S.id++,slot,rarity:rs[ri],quality:q,grade:gr,power:pw,name:sn[slot].slice(2)+" "+rs[ri]}}
function finish(i,strat,rank,dnf,en,legs,ab,pts){let lv=S.cl[i],items=[];if(!dnf){for(let z=0;z<dc(rank);z++)items.push(makeItem(rank,i));S.inv.push(...items);S.credits+=80+(51-rank)*3;S.cl[i]++}let r={course:cs[i].name,level:lv,strategy:strat,power:power(),ability:+ab.toFixed(1),rank:dnf?"DNF":rank,energy:Math.max(0,Math.round(en)),legs:Math.max(0,Math.round(legs)),cp:[pts[9]||rank,pts[24]||rank,pts[39]||rank,rank],drops:items.length,rarities:items.map(x=>x.rarity)};S.races.push(r);log("race",r);autoEquip(true);return r}
function showResult(r){main.innerHTML='<div class=card><h2>'+(r.rank==="DNF"?"❌ DNF":"🏁 "+r.rank+"e / 50")+'</h2><div class=panel>Énergie '+r.energy+'% • Jambes '+r.legs+'%<br>20/50/80/100% : '+r.cp.join(" → ")+'<br>Aptitude parcours : '+r.ability+'</div><button class="pri mt" onclick=racesView()>Continuer</button> <button class=mt onclick=lootView()>🎒 Loot</button></div>'}
function batch10(i,strat){let fee=Math.round(25*S.cl[i]*1.2)*10;if(S.credits<fee){alert("Il faut "+fee+" crédits pour cette série ×10.");return}if(!confirm("Lancer 10 courses ? Coût : "+fee+" crédits."))return;S.credits-=fee;S.batches++;let out=[];for(let n=0;n<10;n++)out.push(simulate(i,strat));save();let dn=out.filter(x=>x.rank==="DNF").length,fin=out.filter(x=>x.rank!=="DNF"),avg=fin.length?(fin.reduce((a,x)=>a+x.rank,0)/fin.length).toFixed(1):"-",drops=out.reduce((a,x)=>a+x.drops,0);main.innerHTML='<div class=card><h2>⏩ Série ×10 terminée</h2><div class=grid><div class=panel>Classement moyen<br><b>'+avg+'</b></div><div class=panel>DNF<br><b>'+dn+'/10</b></div><div class=panel>Drops<br><b>'+drops+'</b></div><div class=panel>Coût série<br><b>'+fee+'</b></div></div><div class=panel>'+out.map((x,n)=>"#"+(n+1)+" : "+(x.rank==="DNF"?"DNF":x.rank+"e")+" • E "+x.energy+"% • J "+x.legs+"%").join("<br>")+'</div><button class="pri mt" onclick=racesView()>Continuer</button> <button class=mt onclick=reportView()>🧪 Rapport</button></div>'}
function rv(x){return [8,15,30,65,150][["Commun","Inhabituel","Rare","Épique","Légendaire"].indexOf(x.rarity)]}function eq(id){return Object.values(S.equip).some(x=>x&&x.id===id)}
function recycle(id){let x=S.inv.find(a=>a.id===id);if(!x||eq(id)||x.rarity==="Légendaire"||x.grade==="👑")return;let v=rv(x);S.inv=S.inv.filter(a=>a.id!==id);S.credits+=v;S.recycled++;S.rc+=v;log("recycle",{item:x.name,value:v});lootView()}
function bulk(){let a=S.inv.filter(x=>!eq(x.id)&&x.rarity!=="Légendaire"&&x.grade!=="👑"&&S.equip[x.slot]&&x.power<=S.equip[x.slot].power);let v=a.reduce((z,x)=>z+rv(x),0);if(!a.length||!confirm("Recycler "+a.length+" objets pour "+v+" crédits ?"))return;let ids=new Set(a.map(x=>x.id));S.inv=S.inv.filter(x=>!ids.has(x.id));S.credits+=v;S.recycled+=a.length;S.rc+=v;log("bulk_recycle",{count:a.length,value:v});lootView()}
function lootView(){clearInterval(rt);let a=[...S.inv].sort((x,y)=>y.power-x.power);main.innerHTML='<div class=card><div class=row><h3>🎒 Inventaire ('+a.length+')</h3><button class=red onclick=bulk()>♻️ Recycler inférieurs</button></div><p class=muted>Légendaires et 👑 protégés automatiquement.</p>'+a.map(x=>'<div class="panel row"><div><b>'+x.name+' '+x.grade+'</b><div class=muted>+'+x.power+' • roll '+x.quality+'% '+(eq(x.id)?"• ÉQUIPÉ":"")+'</div></div><div><button onclick="S.equip[\''+x.slot+'\']=S.inv.find(a=>a.id==='+x.id+');save();lootView()">Équiper</button> <button class=red '+(eq(x.id)||x.rarity==="Légendaire"||x.grade==="👑"?"disabled":"")+' onclick=recycle('+x.id+')>♻️ +'+rv(x)+'</button></div></div>').join("")+'</div>'}
function reportView(){let done=S.races.filter(x=>x.rank!=="DNF"),avg=done.length?(done.reduce((a,x)=>a+x.rank,0)/done.length).toFixed(1):"-";let txt="TRAILBOUND V0.11 — RAPPORT DE TEST\nCourses : "+S.races.length+"\nSéries x10 : "+S.batches+"\nTerminées : "+done.length+"\nDNF : "+(S.races.length-done.length)+"\nClassement moyen : "+avg+"\nPuissance : "+power()+"\nCrédits : "+S.credits+"\nEntraînements : "+S.td+"\nDépenses entraînement : "+S.spent+"\nAccélérateurs : "+S.bu+"\nAuto-équipements : "+S.ae+"\nObjets recyclés : "+S.recycled+"\nCrédits recyclage : "+S.rc+"\nStats : "+JSON.stringify(S.stats)+"\nNiveaux training : "+JSON.stringify(S.lvl)+"\n\nCOURSES DÉTAILLÉES\n"+S.races.map((r,i)=>(i+1)+". "+r.course+" "+r.level+" | "+r.strategy+" | PWR "+r.power+" | aptitude "+r.ability+" | rang "+r.rank+" | énergie "+r.energy+"% | jambes "+r.legs+"% | CP "+r.cp.join(">")+" | drops "+r.drops+" ["+r.rarities.join(",")+"]").join("\n")+"\n\nRESSENTI JOUEUR\nAmusant :\nFrustrant :\nTrop facile/difficile :\nTraining :\nLoot/recyclage :\nCourse x10 :\nAutre :";main.innerHTML='<div class=card><h3>🧪 Rapport V0.11</h3><p class=muted>Tu peux atteindre rapidement 10–30 courses grâce aux séries ×10. Elles sont comptées individuellement.</p><textarea readonly onclick=this.select()>'+txt+'</textarea><button class=mt onclick="if(confirm(\'Effacer toute la sauvegarde V0.11 ?\')){localStorage.removeItem(\'tb11\');location.reload()}">Réinitialiser</button></div>'}
head();trainView();if(S.training)tickTrain();
</script></body></html>
