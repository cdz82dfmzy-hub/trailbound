<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#1b3035"><meta name="apple-mobile-web-app-capable" content="yes"><title>Warehouse Tycoon V0.9</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#16272e;color:#f1f5ef;font:13px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}button{font:inherit;color:inherit;background:#324c54;border:1px solid #587078;border-radius:9px;padding:9px;min-height:39px;font-weight:650;touch-action:manipulation}button.active{background:#d1e7a3;color:#23342b;border-color:#d1e7a3}button:active{filter:brightness(1.12)}.app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}header{flex:none;height:46px;background:#1d353c;border-bottom:1px solid #41585d;display:flex;align-items:center;gap:10px;padding:5px 10px}header strong{font-size:15px;white-space:nowrap}header span{white-space:nowrap;color:#d5e8ca}header .spacer{flex:1}header button{min-height:32px;padding:5px 9px}.body{flex:1;min-height:0;display:flex;gap:6px;padding:6px}.tools{flex:none;width:170px;display:flex;flex-direction:column;gap:5px;overflow-y:auto;scrollbar-width:thin}.tools button{text-align:left;flex:none;font-size:12px}.tools h4{font-size:10px;letter-spacing:.1em;color:#a7c0c0;margin:7px 4px 1px}.stage{flex:1;min-width:0;position:relative;border:2px solid #506a66;border-radius:11px;overflow:hidden;background:#779581;touch-action:none}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.tip{position:absolute;top:8px;left:8px;background:#1c3439e8;padding:7px 10px;border-radius:8px;font-size:11px;max-width:78%;pointer-events:none}.zoom{position:absolute;right:7px;bottom:7px;display:flex;gap:5px}.zoom button{background:#1b333cdd}.foot{height:39px;flex:none;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#1d353c;border-top:1px solid #41585d;font-size:11px}.foot span{flex:1}.modalback{position:fixed;inset:0;background:#061113d0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}.modal{width:min(420px,100%);max-height:90dvh;overflow:auto;background:#253e45;border:1px solid #68868b;border-radius:15px;padding:18px}.modal h2{margin:0 0 8px;font-size:20px}.modal p{line-height:1.5}.modal button{margin:4px}.hidden{display:none!important}@media(orientation:portrait){.body{flex-direction:column}.tools{width:100%;height:110px;flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:center}.tools h4{display:none}.tools button{min-width:125px}.stage{min-height:220px}header strong{font-size:12px}}@media(orientation:landscape) and (max-height:430px){header{height:36px}.tools{width:145px}.tools button{min-height:30px;padding:5px}.tools h4{margin:3px}.foot{height:30px}.tip{font-size:10px}}
</style></head><body><div class="app"><header><strong>🏭 Warehouse Tycoon <small>V0.9</small></strong><span id="cash">400 000 €</span><span>Jour 1</span><span class="spacer"></span><button id="help">❔ Guide</button><button id="reset">↻</button></header><div class="body"><aside class="tools"><h4>AMÉNAGER</h4><button data-tool="inspect" class="active">👆 Explorer</button><button data-tool="receiving">🟦 Réception</button><button data-tool="storage">🟨 Stockage</button><button data-tool="picking">🟩 Préparation</button><button data-tool="shipping">🟧 Expédition</button><h4>ÉQUIPEMENTS</h4><button data-tool="inbound">📥 Poste réception</button><button data-tool="rack">📦 Rack palettes</button><button data-tool="bulk">🟫 Stockage masse</button><button data-tool="bench">🛠️ Poste prépa</button><button data-tool="outbound">📤 Poste expédition</button><h4>MODIFIER</h4><button data-tool="resize">↗ Agrandir cellule</button><button data-tool="erase">🧹 Supprimer</button><button id="undo">↶ Annuler</button></aside><div class="stage" id="stage"><canvas id="board"></canvas><div class="tip" id="tip">Dessine ta première cellule de réception en glissant le doigt.</div><div class="zoom"><button id="minus">−</button><button id="center">⌖</button><button id="plus">+</button></div></div></div><div class="foot"><span id="progress">0/4 cellules opérationnelles</span><span>👆 1 doigt : construire • 2 doigts : zoom/déplacer</span></div></div><div class="modalback hidden" id="modal"><div class="modal"><h2 id="modalTitle"></h2><p id="modalBody"></p><div id="modalButtons"></div></div></div><script>
(()=>{'use strict';
const W=10,H=8,S=55,KEY='warehouseTycoonV09',spec={receiving:{name:'Réception',color:'#75b8d7',min:4,needed:['inbound']},storage:{name:'Stockage',color:'#e0c47a',min:6,needed:['rack','bulk']},picking:{name:'Préparation',color:'#93c796',min:4,needed:['bench']},shipping:{name:'Expédition',color:'#e7a67c',min:4,needed:['outbound']}},items={inbound:{name:'Poste réception',cost:3000,zone:'receiving',emoji:'📥'},rack:{name:'Rack palettes',cost:2500,zone:'storage',emoji:'📦'},bulk:{name:'Stockage masse',cost:900,zone:'storage',emoji:'🟫'},bench:{name:'Poste préparation',cost:3200,zone:'picking',emoji:'🛠️'},outbound:{name:'Poste expédition',cost:2800,zone:'shipping',emoji:'📤'}},$=id=>document.getElementById(id),cv=$('board'),ctx=cv.getContext('2d');
let game,tool='inspect',scale=1,ox=0,oy=0,history=[],drag=null,pts=new Map(),gesture=null;
function fresh(){return{money:400000,zones:[],items:[],id:1,completed:false}}try{game=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(game.zones)||!Array.isArray(game.items))game=fresh()}catch(e){game=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch(e){}}function snap(){history.push(JSON.stringify(game));if(history.length>30)history.shift()}function note(s){$('tip').textContent=s}
function dialog(title,body,buttons){$('modalTitle').textContent=title;$('modalBody').textContent=body;let b=$('modalButtons');b.replaceChildren();buttons.forEach(([label,fn])=>{let el=document.createElement('button');el.textContent=label;el.onclick=()=>{$('modal').classList.add('hidden');if(fn)fn()};b.append(el)});$('modal').classList.remove('hidden')}
function bounds(a,b){return{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x)+1,h:Math.abs(a.y-b.y)+1}}function inside(z,x,y){return x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h}function zone(x,y){return game.zones.find(z=>inside(z,x,y))}function item(x,y){return game.items.find(i=>i.x===x&&i.y===y)}function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function center(){let r=cv.getBoundingClientRect();scale=Math.max(.25,Math.min((r.width-45)/(W*S+110),(r.height-35)/(H*S+150)));ox=(r.width-W*S*scale)/2;oy=(r.height-H*S*scale)/2;draw()}
function resizeCanvas(){let r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));center()}
function tile(p){let x=Math.floor((p.x-ox)/(S*scale)),y=Math.floor((p.y-oy)/(S*scale));return x>=0&&x<W&&y>=0&&y<H?{x,y}:null}
function draw(){let r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#789680';ctx.fillRect(0,0,r.width,r.height);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
ctx.fillStyle='#657d6f';ctx.fillRect(-70,-70,W*S+140,H*S+160);ctx.fillStyle='#a7b4b1';ctx.fillRect(-50,H*S+13,W*S+100,90);ctx.fillStyle='#d7d9d3';ctx.fillRect(0,0,W*S,H*S);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){let z=zone(x,y);if(z){ctx.fillStyle=spec[z.type].color;ctx.globalAlpha=.77;ctx.fillRect(x*S+1,y*S+1,S-2,S-2);ctx.globalAlpha=1}ctx.strokeStyle='#b5c0b9';ctx.lineWidth=1;ctx.strokeRect(x*S,y*S,S,S)}
game.zones.forEach(z=>{ctx.strokeStyle=spec[z.type].color;ctx.lineWidth=4;ctx.strokeRect(z.x*S+2,z.y*S+2,z.w*S-4,z.h*S-4);ctx.fillStyle='#243b3b';ctx.font='bold 12px system-ui';ctx.fillText(spec[z.type].name,z.x*S+6,z.y*S+17);if(z.w*z.h<spec[z.type].min){ctx.fillStyle='#b52f31';ctx.fillText('Trop petit',z.x*S+6,z.y*S+32)}});
game.items.forEach(i=>{let x=i.x*S,y=i.y*S;ctx.fillStyle='#587077';ctx.fillRect(x+8,y+9,S-16,S-18);ctx.strokeStyle='#2c454c';ctx.lineWidth=2;ctx.strokeRect(x+8,y+9,S-16,S-18);ctx.font='23px system-ui';ctx.textAlign='center';ctx.fillText(items[i.type].emoji,x+S/2,y+S/2+8);ctx.textAlign='left'});
ctx.strokeStyle='#65797b';ctx.lineWidth=8;ctx.strokeRect(-4,-4,W*S+8,H*S+8);ctx.strokeStyle='#eff4f0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W*S,0);ctx.stroke();
for(let k=0;k<3;k++){let x=(2+k*3)*S;ctx.fillStyle='#3e8bad';ctx.fillRect(x-22,H*S-5,44,16);ctx.strokeStyle='#f6d478';ctx.lineWidth=3;ctx.strokeRect(x-22,H*S-5,44,16);ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText('QUAI '+(k+1),x-22,H*S+37);ctx.fillStyle='#f4d47b';ctx.fillRect(x-1,H*S+42,2,28)}
ctx.fillStyle='#eef6e9';ctx.font='bold 14px system-ui';ctx.fillText('COUR DE MANŒUVRE',8,H*S+82);ctx.fillText('ACCÈS PIÉTON',8,-19);
if(drag&&drag.start&&drag.end&&(spec[tool]||tool==='resize')){let z=bounds(drag.start,drag.end);ctx.fillStyle='#b7f5d5';ctx.globalAlpha=.36;ctx.fillRect(z.x*S,z.y*S,z.w*S,z.h*S);ctx.globalAlpha=1;ctx.strokeStyle='#277954';ctx.lineWidth=3;ctx.strokeRect(z.x*S,z.y*S,z.w*S,z.h*S)}ctx.restore()}
function refresh(){let ok={};for(let t in spec){ok[t]=game.zones.some(z=>z.type===t&&z.w*z.h>=spec[t].min&&game.items.some(i=>inside(z,i.x,i.y)&&spec[t].needed.includes(i.type)))}let count=Object.values(ok).filter(Boolean).length;$('cash').textContent=game.money.toLocaleString('fr-FR')+' €';$('progress').textContent=count+'/4 cellules opérationnelles · '+(count===4?'Entrepôt prêt pour la suite':Object.keys(ok).filter(t=>!ok[t]).map(t=>spec[t].name).join(' • '));if(count===4&&!game.completed){game.completed=true;save();dialog('Entrepôt aménagé ! 🎉','Les quatre cellules possèdent leur équipement indispensable. Cette première livraison V0.9 permet de construire et sauvegarder ton entrepôt. Le personnel, les flux et les contrats arriveront lors des prochaines étapes.',[['Continuer']])}}
function act(a,b){if(!a)return;if(spec[tool]){let z=bounds(a,b||a),s=spec[tool];if(z.w*z.h<s.min){note(s.name+' : minimum '+s.min+' cases ('+s.min*25+' m²).');return}if(game.zones.some(v=>overlap(v,z))){note('Impossible : les cellules se chevauchent.');return}let cost=z.w*z.h*350;if(game.money<cost){note('Budget insuffisant.');return}snap();game.zones.push({...z,type:tool,id:game.id++});game.money-=cost;note(s.name+' créée ('+(z.w*z.h*25)+' m²). Ajoute un équipement adapté.')}
else if(tool==='resize'){let z=zone(a.x,a.y);if(!z){note('Commence ton glissement dans une cellule.');return}let e=b||a,n={x:Math.min(z.x,e.x),y:Math.min(z.y,e.y),w:Math.max(z.x+z.w,e.x+1)-Math.min(z.x,e.x),h:Math.max(z.y+z.h,e.y+1)-Math.min(z.y,e.y)};if(game.zones.some(v=>v!==z&&overlap(v,n))){note('Agrandissement impossible : autre cellule.');return}let cost=(n.w*n.h-z.w*z.h)*350;if(game.money<cost){note('Budget insuffisant.');return}snap();Object.assign(z,n);game.money-=cost;note('Cellule agrandie. Pour la réduire, supprime-la puis redessine-la.')}
else if(items[tool]){let z=zone(a.x,a.y),e=items[tool];if(!z||z.type!==e.zone){note('Équipement à placer dans une cellule '+spec[e.zone].name+'.');return}if(item(a.x,a.y)){note('Une case ne peut contenir qu’un équipement.');return}if(game.money<e.cost){note('Budget insuffisant.');return}snap();game.items.push({x:a.x,y:a.y,type:tool});game.money-=e.cost;note(e.name+' installé.')}
else if(tool==='erase'){let i=item(a.x,a.y),z=zone(a.x,a.y);if(!i&&!z){note('Aucun élément à supprimer ici.');return}snap();if(i){game.items=game.items.filter(v=>v!==i);note('Équipement supprimé.')}else{game.items=game.items.filter(v=>!inside(z,v.x,v.y));game.zones=game.zones.filter(v=>v!==z);note('Cellule supprimée.')}}else{let i=item(a.x,a.y),z=zone(a.x,a.y);note(i?items[i.type].name:z?spec[z.type].name+' · '+(z.w*z.h*25)+' m²':'Sol libre · '+(a.x+1)+','+(a.y+1))}
save();refresh();draw()}
function xy(e){let r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);let p=xy(e);pts.set(e.pointerId,p);if(pts.size===2){let v=[...pts.values()];gesture={dist:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),mx:(v[0].x+v[1].x)/2,my:(v[0].y+v[1].y)/2,scale,ox,oy};drag=null;return}drag={start:tile(p),end:null,origin:p,moved:false}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;let p=xy(e);pts.set(e.pointerId,p);if(pts.size===2&&gesture){let v=[...pts.values()],dist=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),mx=(v[0].x+v[1].x)/2,my=(v[0].y+v[1].y)/2;scale=Math.max(.3,Math.min(3,gesture.scale*dist/Math.max(10,gesture.dist)));ox=mx-(gesture.mx-gesture.ox)*scale/gesture.scale;oy=my-(gesture.my-gesture.oy)*scale/gesture.scale;draw();return}if(!drag)return;drag.end=tile(p);drag.moved=drag.moved||Math.hypot(p.x-drag.origin.x,p.y-drag.origin.y)>8;if(tool==='inspect'&&drag.moved){ox+=p.x-drag.origin.x;oy+=p.y-drag.origin.y;drag.origin=p}draw()});
function release(e){if(!pts.has(e.pointerId))return;let multi=!!gesture;pts.delete(e.pointerId);if(multi){if(pts.size<2)gesture=null;drag=null;return}if(drag){let a=drag.start,b=drag.end||a,m=drag.moved;drag=null;if(a&&b){if(tool==='inspect'&&m)draw();else act(a,b)}else draw()}}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(v=>v.classList.toggle('active',v===b));note(spec[tool]?'Glisse pour dessiner '+spec[tool].name+' (min. '+spec[tool].min+' cases).':tool==='resize'?'Glisse depuis une cellule vers l’extérieur pour l’agrandir.':tool==='inspect'?'Glisse pour déplacer la vue, pince avec deux doigts pour zoomer.':tool==='erase'?'Touche un équipement ou une cellule pour supprimer.':'Touche une case pour installer '+items[tool].name+'.')});
$('undo').onclick=()=>{if(!history.length){note('Aucune action à annuler.');return}game=JSON.parse(history.pop());save();refresh();draw();note('Dernière action annulée.')};
$('plus').onclick=()=>{scale=Math.min(3,scale*1.25);draw()};$('minus').onclick=()=>{scale=Math.max(.3,scale/1.25);draw()};$('center').onclick=center;
$('reset').onclick=()=>dialog('Nouvelle partie ?','Cette action efface uniquement ta partie V0.9.',['Annuler','Recommencer'].map((t,i)=>[t,i?()=>{game=fresh();history=[];save();refresh();center();note('Nouvelle partie : dessine ta réception près des quais.')}:null]));
$('help').onclick=()=>dialog('Bienvenue dans Warehouse Tycoon','Oriente ton iPhone horizontalement. Crée quatre cellules en glissant sur le sol : réception (4 cases), stockage (6), préparation (4), expédition (4). Ajoute ensuite le poste nécessaire dans chaque cellule. Un équipement occupe une case de 5 × 5 m. Explorer permet de déplacer la caméra, deux doigts permettent de zoomer. Les modifications sont sauvegardées automatiquement.',['Jouer'].map(t=>[t]));
window.addEventListener('resize',resizeCanvas);new ResizeObserver(resizeCanvas).observe($('stage'));resizeCanvas();refresh();if(!game.zones.length)setTimeout(()=>$('help').click(),400);
})();
</script></body></html>
