<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trailbound V0.13</title><style>:root{--b:#0e1512;--c:#17211c;--p:#202d26;--l:#35483d;--t:#eff8f2;--m:#aabbb0;--a:#72d991}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui,-apple-system,sans-serif}.w{max-width:900px;margin:auto;padding:14px}.head,.grid{display:grid;gap:9px}.head{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px}.panel{background:var(--p);padding:10px;border-radius:11px;margin-top:8px}.muted{color:var(--m);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}button{background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:10px;padding:10px;font-weight:700}button.pri{background:#245235}button.red{background:#4d2929}textarea{width:100%;height:420px;background:#0b100d;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:10px}.mt{margin-top:10px}@media(max-width:650px){.head{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.tabs{font-size:10px}}</style></head><body><div class=w><div id=head class=head></div><div class=tabs><button onclick="trainView()">🏋️<br>Training</button><button onclick="runnerView()">🏃<br>Traileur</button><button onclick="racesView()">⛰️<br>Courses</button><button onclick="lootView()">🎒<br>Loot</button><button onclick="reportView()">🧪<br>Rapport</button></div><main id=main></main></div><script>
const ds=[["Zone 2","end"],["Fractionné","speed"],["Côtes","climb"],["Descente","tech"],["Renforcement","strength"],["Récupération","recovery"]];
const cs=[{name:"Sentier des Pins",km:8,up:280,w:{speed:.5,end:.2,tech:.15,strength:.05,climb:.05,recovery:.05},fav:"shoes",stress:.8},{name:"Pic des Brumes",km:21,up:1350,w:{climb:.4,end:.3,strength:.1,recovery:.1,tech:.05,speed:.05},fav:"poles",stress:1.15},{name:"Forteresse des Alpes",km:32,up:2200,w:{tech:.35,strength:.25,end:.2,climb:.1,recovery:.07,speed:.03},fav:"shoes",stress:1.4}];
const sn={shoes:"👟 Chaussures",poles:"🦯 Bâtons",jacket:"🧥 Veste",pack:"🎒 Sac"};
const fresh=()=>({credits:3000,boost:5,stats:{end:50,speed:50,climb:50,tech:50,strength:50,recovery:50},lvl:{end:1,speed:1,climb:1,tech:1,strength:1,recovery:1},equip:{shoes:null,poles:null,jacket:null,pack:null},inv:[],cl:[1,1,1],sel:[1,1,1],id:1,races:[],td:0,recycled:0,rc:0,ae:0,batches:0,injuries:0,injuryDays:0});
let S;try{S=JSON.parse(localStorage.getItem("tb11"))||fresh()}catch(e){S=fresh()}let F=fresh();for(let k in F)if(S[k]==null)S[k]=F[k];for(let k in F.stats)if(S.stats[k]==null)S.stats[k]=50;for(let k in F.lvl)if(S.lvl[k]==null)S.lvl[k]=1;if(!Array.isArray(S.races))S.races=[];if(!Array.isArray(S.inv))S.inv=[];if(!Array.isArray(S.cl))S.cl=[1,1,1];if(!Array.isArray(S.sel))S.sel=[1,1,1];S.races.forEach(r=>{if(r.injury==null)r.injury=false;if(!Array.isArray(r.rarities))r.rarities=[]});
const main=document.getElementById("main");function save(){localStorage.setItem("tb11",JSON.stringify(S));head()}function power(){return Object.values(S.stats).reduce((a,b)=>a+b,0)+Object.values(S.equip).filter(Boolean).reduce((a,x)=>a+(x.power||0),0)}function head(){document.getElementById("head").innerHTML=[["Mont","I"],["Crédits",S.credits],["Accél.",S.boost],["Puissance",power()],["Courses",S.races.length]].map(x=>'<div class=card><span class=muted>'+x[0]+'</span><br><b>'+x[1]+'</b></div>').join("")}function gain(l){return Math.max(2,Math.round(1.2+1.25*Math.pow(l,.72)))}
function trainView(){main.innerHTML='<div class=grid>'+ds.map((d,i)=>{let l=S.lvl[d[1]];return '<div class=card><div class=row><b>'+d[0]+'</b><b>Nv.'+l+'</b></div><div class=panel>Stat '+S.stats[d[1]]+'<br>Prochain gain <b>+'+gain(l)+'</b><br>🧪 GRATUIT • INSTANTANÉ</div><button class="pri mt" onclick="startTrain('+i+')">Améliorer gratuitement</button></div>'}).join("")+'</div>'}function startTrain(i){let d=ds[i],g=gain(S.lvl[d[1]]);S.stats[d[1]]+=g;S.lvl[d[1]]++;S.td++;save();trainView()}
function runnerView(){main.innerHTML='<div class=grid><div class=card><h3>🏃 Profil</h3>'+Object.entries(S.stats).map(([k,v])=>'<div class="panel row"><span>'+k+' • Nv.'+S.lvl[k]+'</span><b>'+v+'</b></div>').join("")+'</div><div class=card><div class=row><h3>Build</h3><button class=pri onclick="autoEquip(false)">⚡ Auto-équip</button></div>'+Object.entries(sn).map(([k,n])=>'<div class=panel><b>'+n+'</b><div class=muted>'+(S.equip[k]?S.equip[k].name+' • +'+S.equip[k].power:'Vide')+'</div></div>').join("")+'</div></div>'}function autoEquip(silent=true){let n=0;Object.keys(sn).forEach(k=>{let x=S.inv.filter(a=>a.slot===k).sort((a,b)=>b.power-a.power)[0];if(x&&(!S.equip[k]||x.power>S.equip[k].power)){S.equip[k]=x;n++;S.ae++}});save();if(!silent)runnerView();return n}
function racesView(){main.innerHTML='<div class=grid>'+cs.map((c,i)=>'<div class=card><div class=row><b>'+c.name+'</b><b>Max '+S.cl[i]+'</b></div><div class=muted>'+c.km+' km • D+ '+c.up+' m</div><div class="panel row"><button onclick="pickLevel('+i+',-1)">−</button><b>Niveau '+S.sel[i]+'</b><button onclick="pickLevel('+i+',1)">+</button></div><button class="pri mt" onclick="prep('+i+')">Préparer</button></div>').join("")+'</div>'}function pickLevel(i,d){S.sel[i]=Math.max(1,Math.min(S.cl[i],S.sel[i]+d));save();racesView()}
function risk(i,strat){let c=cs[i],base=strat==='attack'?.07:strat==='balanced'?.025:.008,ex=(c.km/8)*.32+(c.up/280)*.18+S.sel[i]*.1,prot=Math.max(.35,1-(S.stats.strength-50)/180-(S.stats.recovery-50)/260);return Math.min(.32,base*ex*prot)}function prep(i){let r0=Math.round(risk(i,'safe')*100),r1=Math.round(risk(i,'balanced')*100),r2=Math.round(risk(i,'attack')*100);main.innerHTML='<div class=card><h2>'+cs[i].name+' — Niv.'+S.sel[i]+'</h2><p class=muted>🧪 MODE TEST • ×100 gratuit • build figé pendant la série</p><div class=panel><label><input type=radio name=s value=safe> 🛡️ Prudente — blessure ~'+r0+'%</label><br><label><input type=radio name=s value=balanced checked> ⚖️ Régulière — ~'+r1+'%</label><br><label><input type=radio name=s value=attack> 🔥 Offensive — ~'+r2+'%</label></div><button class="pri mt" onclick="runOne('+i+')">🏁 Course normale</button> <button class=mt onclick="batch100('+i+')">⏩ Simuler ×100</button></div>'}function chosen(){return document.querySelector('input[name=s]:checked').value}
function ability(c,stats=S.stats,equip=S.equip){let a=0;for(let k in c.w)a+=stats[k]*c.w[k];return a+Object.values(equip).filter(Boolean).reduce((z,x)=>z+(x.power||0),0)*.55}function dropCount(r){return r===1?5:r<=3?4:r<=14?3:r<=24?2:1}
function makeItem(rank,i,force=false){let slot=Math.random()<.45?cs[i].fav:Object.keys(sn)[Math.floor(Math.random()*4)],bonus=rank<=10?(11-rank)*.005:0,x=Math.random(),ri=x<.006+bonus?4:x<.06+bonus*1.6?3:x<.30?2:x<.72?1:0;if(force&&ri<3)ri=3;let rs=["Commun","Inhabituel","Rare","Épique","Légendaire"],q=Math.floor(Math.random()*100),grade=ri>=3?(q>=90?"⭐⭐⭐⭐":q>=75?"⭐⭐⭐":q>=60?"⭐⭐":"⭐"):"";if(ri===4&&Math.random()<.001){q=100;grade="👑"}return{id:S.id++,slot,rarity:rs[ri],quality:q,grade,power:Math.max(1,Math.round((ri+1)*2+q/24)),name:sn[slot].slice(2)+' '+rs[ri]}}
function simulate(i,strat,stats,equip,level){let c=cs[i],ab=ability(c,stats,equip),cfg=strat==='attack'?{pace:6,ed:1.18,ld:1.15}:strat==='safe'?{pace:-4,ed:.72,ld:.76}:{pace:1,ed:.92,ld:.94},en=100,legs=100,rank=30,pts=[],endEff=Math.max(.55,1-(stats.end-50)/180),legEff=Math.max(.58,1-(stats.strength-50)/190);for(let p=2;p<=100;p+=2){en-=1.02*cfg.ed*c.stress*endEff;legs-=.82*cfg.ld*c.stress*legEff;let opp=50+level*4.4+Math.pow(Math.max(0,level-1),1.28)*1.7,ex=Math.max(0,25-en)*.22+Math.max(0,22-legs)*.18,target=Math.max(1,Math.min(50,Math.round(26-((ab+cfg.pace-ex-opp)/6)*2.25)));rank=Math.round(Math.max(1,Math.min(50,rank+(target-rank)*.18+(Math.random()-.5)*2.4)));pts.push(rank);if(en<=-12||legs<=-10)return{rank:'DNF',rawRank:rank,en,legs,ab,pts,injury:false}}let base=strat==='attack'?.07:strat==='balanced'?.025:.008,exposure=(c.km/8)*.32+(c.up/280)*.18+level*.1,prot=Math.max(.35,1-(stats.strength-50)/180-(stats.recovery-50)/260),injury=Math.random()<Math.min(.32,base*exposure*prot);if(injury)rank=Math.min(50,rank+(strat==='attack'?3:2));return{rank,rawRank:rank,en,legs,ab,pts,injury}}
function record(i,strat,res,level,allowEquip){let items=[];if(res.rank!=='DNF'){for(let z=0;z<dropCount(res.rank);z++)items.push(makeItem(res.rank,i,res.rank===1&&z===0));S.inv.push(...items);S.credits+=80+(51-res.rank)*3;if(level===S.cl[i])S.cl[i]++}if(res.injury){S.injuries++;S.injuryDays+=strat==='attack'?3:strat==='balanced'?2:1}let r={course:cs[i].name,level,strategy:strat,power:power(),ability:+res.ab.toFixed(1),rank:res.rank,injury:res.injury,energy:Math.max(0,Math.round(res.en)),legs:Math.max(0,Math.round(res.legs)),drops:items.length,rarities:items.map(x=>x.rarity)};S.races.push(r);if(allowEquip)autoEquip(true);return r}
function runOne(i){let s=chosen(),lv=S.sel[i],r=record(i,s,simulate(i,s,S.stats,S.equip,lv),lv,true);save();main.innerHTML='<div class=card><h2>'+(r.rank==='DNF'?'❌ DNF':'🏁 '+r.rank+'e / 50')+'</h2><div class=panel>Énergie '+r.energy+'% • Jambes '+r.legs+'% • Blessure '+(r.injury?'⚠️ Oui':'Non')+'<br>Aptitude : '+r.ability+'</div><button class="pri mt" onclick="racesView()">Continuer</button></div>'}
function batch100(i){if(!confirm('Lancer 100 courses avec le build actuel figé ?'))return;let strat=chosen(),lv=S.sel[i],stats=JSON.parse(JSON.stringify(S.stats)),equip=JSON.parse(JSON.stringify(S.equip)),out=[];S.batches++;for(let n=0;n<100;n++)out.push(record(i,strat,simulate(i,strat,stats,equip,lv),lv,false));autoEquip(true);S.sel[i]=Math.min(S.cl[i],lv+1);save();let fin=out.filter(x=>x.rank!=='DNF'),dn=100-fin.length,avg=fin.length?(fin.reduce((a,x)=>a+x.rank,0)/fin.length).toFixed(1):'-',inj=out.filter(x=>x.injury).length,t1=fin.filter(x=>x.rank===1).length,t3=fin.filter(x=>x.rank<=3).length,t10=fin.filter(x=>x.rank<=10).length;main.innerHTML='<div class=card><h2>⏩ ×100 terminé — Niv.'+lv+'</h2><div class=grid><div class=panel>Rang moyen<br><b>'+avg+'</b></div><div class=panel>Top 1 / 3 / 10<br><b>'+t1+' / '+t3+' / '+t10+'</b></div><div class=panel>DNF<br><b>'+dn+'/100</b></div><div class=panel>Blessures<br><b>'+inj+'/100</b></div></div><button class="pri mt" onclick="racesView()">Continuer</button> <button class=mt onclick="reportView()">🧪 Rapport</button></div>'}
function eq(id){return Object.values(S.equip).some(x=>x&&x.id===id)}function rv(x){return [8,15,30,65,150][["Commun","Inhabituel","Rare","Épique","Légendaire"].indexOf(x.rarity)]||5}function recycle(id){let x=S.inv.find(a=>a.id===id);if(!x||eq(id)||x.rarity==='Légendaire'||x.grade==='👑')return;S.inv=S.inv.filter(a=>a.id!==id);S.credits+=rv(x);S.recycled++;S.rc+=rv(x);save();lootView()}function bulk(){let a=S.inv.filter(x=>!eq(x.id)&&x.rarity!=='Légendaire'&&x.grade!=='👑'&&S.equip[x.slot]&&x.power<=S.equip[x.slot].power);if(!a.length)return alert('Aucun objet inférieur à recycler.');let v=a.reduce((z,x)=>z+rv(x),0);if(!confirm('Recycler '+a.length+' objets pour '+v+' crédits ?'))return;let ids=new Set(a.map(x=>x.id));S.inv=S.inv.filter(x=>!ids.has(x.id));S.credits+=v;S.recycled+=a.length;S.rc+=v;save();lootView()}function lootView(){let a=[...S.inv].sort((x,y)=>y.power-x.power);main.innerHTML='<div class=card><div class=row><h3>🎒 Inventaire ('+a.length+')</h3><button class=red onclick="bulk()">♻️ Recycler inférieurs</button></div>'+a.slice(0,300).map(x=>'<div class="panel row"><div><b>'+x.name+' '+(x.grade||'')+'</b><div class=muted>+'+x.power+' • roll '+x.quality+'% '+(eq(x.id)?'• ÉQUIPÉ':'')+'</div></div><button class=red '+(eq(x.id)||x.rarity==='Légendaire'||x.grade==='👑'?'disabled':'')+' onclick="recycle('+x.id+')">♻️</button></div>').join('')+'</div>'}
function reportText(){let done=S.races.filter(x=>x.rank!=='DNF'),by={};S.races.forEach(r=>{let k=r.course+' N'+r.level+' '+r.strategy,b=by[k]||(by[k]={n:0,fin:0,dnf:0,sum:0,e:0,j:0,inj:0,t1:0,t3:0,t10:0,drops:0,rar:{}});b.n++;if(r.rank==='DNF')b.dnf++;else{b.fin++;b.sum+=r.rank;b.t1+=r.rank===1;b.t3+=r.rank<=3;b.t10+=r.rank<=10}b.e+=r.energy||0;b.j+=r.legs||0;b.inj+=r.injury?1:0;b.drops+=r.drops||0;(r.rarities||[]).forEach(q=>b.rar[q]=(b.rar[q]||0)+1)});let lines=Object.entries(by).map(([k,b])=>k+' | n '+b.n+' | rang moy '+(b.fin?(b.sum/b.fin).toFixed(1):'-')+' | Top1/3/10 '+b.t1+'/'+b.t3+'/'+b.t10+' | DNF '+b.dnf+' | blessures '+b.inj+' | E/J moy '+Math.round(b.e/b.n)+'%/'+Math.round(b.j/b.n)+'% | drops '+b.drops+' | '+JSON.stringify(b.rar));return 'TRAILBOUND V0.13 — RAPPORT COMPACT\nCourses : '+S.races.length+' | Séries x100 : '+S.batches+' | DNF : '+(S.races.length-done.length)+'\nPuissance : '+power()+' | Crédits : '+S.credits+' | Blessures : '+S.injuries+'\nStats : '+JSON.stringify(S.stats)+'\nTraining : '+JSON.stringify(S.lvl)+'\n\nRÉSUMÉ PAR CONFIGURATION\n'+(lines.join('\n')||'Aucune course')+'\n\nRESSENTI JOUEUR\nAmusant :\nFrustrant :\nTrop facile/difficile :\nTraining :\nLoot/recyclage :\nCourse x100 :\nAutre :'}function reportView(){main.innerHTML='<div class=card><h3>🧪 Rapport compact V0.13</h3><p class=muted>Conçu pour être collé directement dans ChatGPT, même après des milliers de courses.</p><textarea id=rep readonly></textarea><button class="pri mt" onclick="copyReport()">📋 Copier le rapport</button> <button class=mt onclick="resetGame()">Réinitialiser</button></div>';document.getElementById('rep').value=reportText()}function copyReport(){let t=document.getElementById('rep');t.select();t.setSelectionRange(0,999999);if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t.value).then(()=>alert('Rapport copié !')).catch(()=>document.execCommand('copy'));else document.execCommand('copy')}function resetGame(){if(confirm('Effacer toute la sauvegarde ?')){localStorage.removeItem('tb11');location.reload()}}
head();trainView();
</script></body></html>
